<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3a34">
<title>Doğrudan Temin Asistanı</title>
<style>
:root{--bg:#f3eee4;--paper:#fffdf9;--ink:#1d2a2c;--mut:#6b6f68;--line:#e3dccd;--pine:#0f5249;--pine2:#0a3a34;--pine3:#e2eee8;--amber:#d4862f;--amber2:#fbeed9;--ok:#2e7d4f;--warn:#b7791f;--err:#b33a3a;--r:14px;--sh:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:30;color:#fff;display:flex;align-items:center;gap:10px;padding:9px 12px;min-height:58px;
 background:var(--pine2) repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand .mark{width:36px;height:36px;color:var(--amber);stroke-width:1.6}
.brand b{font-family:Georgia,"Times New Roman",serif;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.top .sp{flex:1}
.ibtn{border:0;background:rgba(255,255,255,.1);color:#fff;width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.ibtn:active{background:rgba(255,255,255,.2)}
.save{font-size:11.5px;opacity:.8;display:flex;align-items:center;gap:4px}
.save svg{width:14px;height:14px}
@media(max-width:480px){.save .st{display:none}.save svg{width:17px;height:17px}.top{gap:6px}.ibtn{width:38px;height:38px}}
.wrap{max-width:880px;margin:0 auto;padding:14px 12px 110px}
.steps{position:sticky;top:58px;z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;color:var(--ink);font-weight:600}
.chip .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--pine3);color:var(--pine);font-weight:800;font-size:12px}
.chip .n svg{width:15px;height:15px}
.chip.done .n{background:var(--ok);color:#fff}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.chip.on .n{background:var(--amber);color:#fff}
.chip .bd{background:var(--err);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:2px}
.chip .bd.w{background:var(--warn)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 svg{color:var(--pine)}
.card h3{margin:16px 0 8px;font-size:14.5px;color:var(--pine2)}
.lead{color:var(--mut);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut);min-width:0}
.f>span{font-weight:600;color:#3d4744}
.f small{font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #d6cdb9;border-radius:10px;padding:9px 11px;min-height:44px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical;line-height:1.4}
input,select,textarea{color:#0b1416;font-weight:600;-webkit-text-fill-color:#0b1416}
input::placeholder,textarea::placeholder{color:#a39d8f;-webkit-text-fill-color:#a39d8f;font-weight:400;opacity:1}
input:disabled,select:disabled,textarea:disabled{color:#3a4447;-webkit-text-fill-color:#3a4447;opacity:1;background:#f7f4ed}
.sat input,.sat select{font-weight:600}
.page[contenteditable]{font-weight:normal}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,82,73,.25);border-color:var(--pine)}
input[inputmode=decimal]{text-align:right;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:650;font-size:14px;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.a{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.g{background:transparent;border-color:transparent;color:var(--pine)}
.btn.s{min-height:36px;padding:6px 10px;font-size:13px;border-radius:9px}
.btn.d{color:var(--err)}
.btn.w{width:100%}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.seg{display:inline-flex;background:var(--pine3);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:650;color:var(--pine);min-height:38px}
.seg button.on{background:#fff;box-shadow:var(--sh);color:var(--pine2)}
.sw{display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;padding:4px 0}
.sw input{appearance:none;-webkit-appearance:none;width:46px;min-width:46px;height:28px;min-height:28px;border-radius:20px;background:#d8d0bf;border:0;padding:0;position:relative;transition:.2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked{background:var(--pine)}
.sw input:checked::after{left:21px}
.sw small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.item .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.item .hd .t{flex:1;font-weight:700;min-width:0}
.nb{width:28px;height:28px;min-width:28px;border-radius:8px;display:grid;place-items:center;background:var(--amber2);color:#8a5418;font-weight:800;font-size:13px}
.nb.k{background:var(--pine3);color:var(--pine)}
.pr{display:grid;grid-template-columns:1fr 130px;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.pr .pn{font-size:13.5px;font-weight:600;min-width:0}
.pr .pn small{display:block;color:var(--mut);font-weight:400}
.pr .pt{grid-column:2;text-align:right;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:9px;border-top:1px solid var(--line);margin-top:4px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--mut);font-weight:700}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.win td{background:#eef6f1}
.scroll{overflow-x:auto}
.big{font-size:24px;font-weight:800;color:var(--pine);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.kpi b{font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:9px;background:#ece5d6;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.bar i.w{background:var(--warn)}.bar i.e{background:var(--err)}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start;margin:8px 0}
.note svg{width:18px;height:18px;margin-top:1px}
.note.warn{background:#fdf3e1;color:#7a5512}.note.err{background:#fbe7e7;color:#8a2a2a}.note.ok{background:#e4f2ea;color:#1f5e3a}.note.info{background:var(--pine3);color:var(--pine2)}
.note a{color:inherit;font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(243,238,228,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:880px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.foot .btn{flex:1;max-width:220px}
.hero{background:var(--pine) repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 10px);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:23px;margin:0 0 6px;font-weight:700}
.hero p{margin:0 0 14px;opacity:.85;font-size:14px;max-width:520px}
.hero .seal{position:absolute;right:-18px;top:-18px;width:130px;height:130px;color:rgba(212,134,47,.28);stroke-width:1.2}
.dosya{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;cursor:pointer}
.dosya .ic{width:44px;height:44px;border-radius:12px;background:var(--pine3);color:var(--pine);display:grid;place-items:center;flex:none}
.dosya .mid{flex:1;min-width:0}
.dosya .mid b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;margin-bottom:2px}
.dosya{flex-wrap:wrap;align-items:flex-start}.dosya .mid{flex:1 1 calc(100% - 60px)}.dosya .acts{display:flex;gap:2px;margin-left:auto;margin-top:-4px}.dosya .btn.s{padding:6px 8px;min-height:34px;font-size:12.5px}
.dosya .mid small{color:var(--mut);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--amber2);color:#8a5418;margin-right:4px}
.tag.h{background:#e4ecf6;color:#2c4d78}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty svg{width:42px;height:42px;color:#c2b8a3}
.dl{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
.dl input[type=checkbox]{width:22px;min-width:22px;height:22px;min-height:22px;accent-color:var(--pine)}
.dl .mid{flex:1;min-width:0;font-weight:600;font-size:14px}
.dl .mid small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.mk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.mk .tx{flex:1}
.mk button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:16px}
.mk button.p{background:#e4f2ea;color:var(--ok);border-color:#b9dcc6}
.mk button.m{background:#fbe7e7;color:var(--err);border-color:#efc3c3}
.mk button.s{background:#eef0f1;color:#55606a}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .st{position:relative;margin-bottom:14px}
.tl .st::before{content:attr(data-n);position:absolute;left:-26px;top:0;width:22px;height:22px;border-radius:50%;background:var(--pine);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.tl .st b{display:block}
.tl .st span{color:var(--mut);font-size:13.5px}
.modal{position:fixed;inset:0;z-index:50;background:#2b3330;display:flex;flex-direction:column}
.mbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--pine2);color:#fff;min-height:56px}
.mbar .btn.mb{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
@media(max-width:480px){.mbar b{font-size:13px}.mbar .btn.mb .mbt{display:none}.mbar .mbt{display:none}.mbar .btn.s{padding:6px 8px;gap:5px}}
.mbar b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhint{background:#3a4440;color:#d9e2de;font-size:12px;text-align:center;padding:6px 10px}
.mbody{flex:1;overflow:auto;padding:14px 8px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.mut{color:var(--mut)}
.right{text-align:right}
details.more{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
details.more summary{cursor:pointer;font-weight:700;color:var(--pine);padding:8px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary svg{transform:rotate(90deg)}
.hidden{display:none!important}
.row>.f,.grow{flex:1}
/* etiket yanında form */
.yanform .grid,.grid.yanform{gap:8px}
.grid.yanform .f{display:grid;grid-template-columns:minmax(104px,36%) 1fr;align-items:center;gap:3px 10px}
.yanform .f{display:grid;grid-template-columns:minmax(104px,36%) 1fr;align-items:center;gap:3px 10px}
.yanform .f>span{font-size:13px;line-height:1.25}
.yanform .f small{grid-column:2}
@media(min-width:760px){.yanform .grid{grid-template-columns:1fr 1fr;column-gap:20px}}
/* satır listeleri */
.sat{display:grid;gap:5px;align-items:center;margin-bottom:5px}
.sat input,.sat select{min-height:40px;padding:7px 8px;font-size:14px;border-radius:8px}
.sat select{padding-right:2px}
.sat.bas{font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:3px;padding:0 2px}
.c-kalem{grid-template-columns:26px minmax(0,1.6fr) minmax(0,1.1fr) 62px 112px 30px}
.c-kom{grid-template-columns:22px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 30px}
.c-pers{grid-template-columns:22px minmax(0,1.3fr) minmax(0,1fr) 30px}
.sat .sn{width:24px;height:30px;border:0;background:none;color:var(--mut);font-weight:800;font-size:12.5px;padding:0;text-align:center}
.sat button.sn{background:var(--pine3);color:var(--pine);border-radius:7px}
.xb{width:30px;height:34px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--mut);padding:0}
.xb.d{color:var(--err)} .xb svg{width:17px;height:17px} .xb[disabled]{opacity:.3}
.kal{border-bottom:1px dashed var(--line);padding-bottom:5px;margin-bottom:5px}
.kmenu{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px 31px}
.tkw{position:relative;margin:0 0 2px 31px}
.kal .okas{margin:0 0 5px 31px;width:calc(100% - 31px);min-height:38px;font-size:13px;padding:6px 9px;border-radius:8px}
.mysad{margin:0 0 5px 31px;font-size:12px;color:var(--pine);display:flex;align-items:center;gap:4px}.mysad svg{width:13px;height:13px}
.kal .tk{min-height:76px;width:100%;font-size:13.5px;padding-bottom:30px}
.tko{position:absolute;right:6px;bottom:7px;display:flex;align-items:center;gap:4px;border:1px solid #efd9b5;background:var(--amber2);color:#8a5418;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700}
.tko svg{width:14px;height:14px}
@media(max-width:560px){
 .sat.bas.c-kalem,.sat.bas.c-kom{display:none}
 .c-kalem{grid-template-columns:26px minmax(0,1fr) 58px 104px 28px;grid-template-areas:"sn ad ad ad xb" ". oz mk br .";row-gap:5px}
 .c-kalem>:nth-child(1){grid-area:sn}.c-kalem>:nth-child(2){grid-area:ad;font-weight:600}.c-kalem>:nth-child(3){grid-area:oz}.c-kalem>:nth-child(4){grid-area:mk}.c-kalem>:nth-child(5){grid-area:br}.c-kalem>:nth-child(6){grid-area:xb}
 .c-kom{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 28px;grid-template-areas:"sn ad ad xb" ". un gv .";row-gap:5px}
 .c-kom>:nth-child(1){grid-area:sn}.c-kom>:nth-child(2){grid-area:ad;font-weight:600}.c-kom>:nth-child(3){grid-area:un}.c-kom>:nth-child(4){grid-area:gv}.c-kom>:nth-child(5){grid-area:xb}
 .c-kom{border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:6px}
 .item{padding:10px}
 .kmenu{margin-left:31px}
 .sat input,.sat select{font-size:14px;padding:7px 7px}
}
.dosya .ic .dno{font-size:11px;line-height:1.15;text-align:center;font-weight:800}
.dosya.ars{background:#faf8f3}.dosya.ars .ic{background:#ece6d8;color:#6b5f45}
svg.i.xs{width:13px;height:13px;vertical-align:-2px}
details.card>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{margin:0;flex:1}
.kdz{display:flex;align-items:center;gap:5px;color:var(--pine);font-weight:700;font-size:13px}
details[open] .kdz,details[open] .ksum{display:none}
.ksum{width:100%;font-size:13px;color:var(--mut);order:3}
.cnt{background:var(--pine3);color:var(--pine);border-radius:9px;font-size:12px;padding:1px 8px;font-weight:800}
.antet{margin-top:12px;border:1px dashed #cfc5ae;border-radius:10px;padding:10px;text-align:center;font:600 13px/1.35 "Times New Roman",Georgia,serif;background:#fff}
.antet:empty{display:none}
.lock{display:flex;align-items:center;gap:10px;background:#efe9db;border:1px solid #ddd2b8;color:#5b4f33;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.lock{flex-wrap:wrap}.lock .tx{flex:1 1 220px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:55}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:56;background:var(--paper);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:16px}.sh-h b{flex:1}.sh-h svg{color:var(--pine)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-top:8px;color:var(--ink)}
.opt svg{color:var(--amber);margin-top:2px}.opt b{display:block;font-size:14.5px}.opt small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
/* ===== BELGE SAYFALARI ===== */
.page{background:#fff;color:#000;width:210mm;min-height:297mm;padding:14mm 14mm 12mm;font:11pt/1.35 "Times New Roman","Liberation Serif","Noto Serif",Georgia,serif;box-shadow:0 6px 24px rgba(0,0,0,.35);flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page.yatay{width:297mm;min-height:210mm;padding:10mm}
.page *{box-sizing:border-box}
.page .dh{text-align:center;font-weight:bold;line-height:1.3;margin-bottom:10px}
.page .ttl{text-align:center;font-weight:bold;font-size:12.5pt;margin:10px 0 8px}
.page .mkm{text-align:center;font-weight:bold;margin:14px 0 2px}
.page .sx{display:flex;justify-content:space-between;gap:10px}
.page .meta{margin:2px 0}
.page .meta b{display:inline-block;min-width:44px}
.page p{margin:6px 0}
.page p.prg{text-indent:1.25cm;text-align:justify}
.page table.t{width:100%;border-collapse:collapse;margin:6px 0}
.page .t th,.page .t td{border:1px solid #000;padding:2.5px 5px;font-size:10pt;vertical-align:middle}
.page .t th{background:#efefef;font-weight:bold;text-align:center}
.page.yatay .t th,.page.yatay .t td{font-size:9pt;padding:2px 4px}
.page .t .r{text-align:right;white-space:nowrap}
.page .t .c{text-align:center}
.page .t tr.tp td{font-weight:bold}

const usulMetin=a=>`4734 Sayılı Kamu İhale Kanunu'nun ${a.usul} Maddesi`;
const okulTam=()=>`${kur().okul} ${kur().okulEk||''}`.trim();
function tevOran(s){ if(!s||s==='0') return 0; const [p,q]=String(s).split('/'); return num(p)/num(q||10); }
function limitDeger(){ const k=kur(); return num(k.limitTur==='buyuksehir'?k.limitB:k.limitD); }
function hesap(a){
  const K=a.kalemler.map((k,i)=>({...k,i,m:num(k.miktar)})).filter(k=>String(k.ad).trim());
  const fp=(f,k)=>num(f.fiyat[k.i]);
  const ymK=K.map(k=>{ const fs=a.ymF.map(f=>fp(f,k)).filter(v=>v>0); const bf=fs.length?r2(fs.reduce((s,v)=>s+v,0)/fs.length):0; return {...k,n:fs.length,bf,toplam:r2(bf*k.m)}; });
  const ymToplam=r2(ymK.reduce((s,k)=>s+k.toplam,0));
  const ymFT=a.ymF.map(f=>r2(K.reduce((s,k)=>s+r2(fp(f,k)*k.m),0)));
  const paT=a.paF.map((f,fi)=>({fi,ad:f.ad,tam:K.length>0&&K.every(k=>fp(f,k)>0),bos:K.every(k=>!fp(f,k)),top:r2(K.reduce((s,k)=>s+r2(fp(f,k)*k.m),0))}));
  const aday=paT.filter(t=>t.tam);
  let kaz=-1, esit=false, oto=true;
  if(a.kazanan!=='oto' && a.paF[+a.kazanan]){ kaz=+a.kazanan; oto=false; }
  else if(aday.length){ const mn=Math.min(...aday.map(t=>t.top)); const m=aday.filter(t=>t.top===mn); kaz=m[0].fi; esit=m.length>1; }
  const kf=kaz>=0?a.paF[kaz]:null;
  const kK=K.map(k=>{ const b=kf?fp(kf,k):0; const km=String(k.kabul).trim()===''?k.m:num(k.kabul); return {...k,bf:b,toplam:r2(b*k.m),kabulM:km,kalan:r2(k.m-km),kabulT:r2(b*km)}; });
  const kazTop=r2(kK.reduce((s,k)=>s+k.toplam,0));
  const kabulTop=r2(kK.reduce((s,k)=>s+k.kabulT,0));
  const kdv=num(a.kdv)/100, h=a.hak;
  const A=kabulTop, B=num(h.fiyatFarki), C=r2(A+B), D=num(h.onceki), E=r2(C-D), F=r2(E*kdv), G=r2(E+F);
  const ks={a:r2(E*num(h.gelirV)/100), b:h.damga?r2(E*num(h.damgaOran)/1000):0, c:r2(F*tevOran(h.tevkifat)), d:num(h.sgk), e:num(h.makine), f:num(h.gecikme), g:num(h.avans), h:num(h.teminat)};
  const H=r2(Object.values(ks).reduce((s,v)=>s+v,0));
  return {K,ymK,ymToplam,ymFT,paT,aday,kaz,kf,esit,oto,kK,kazTop,kabulTop,kdv,hak:{A,B,C,D,E,F,G,ks,H,net:r2(G-H)},
    limit:limitDeger(),gun:gunFark(a.tarih.ihtiyac,a.tarih.muayene),odenekKdvli:r2(ymToplam*(1+kdv))};
}
const TARIH_SIRA=[['ihtiyac','İhtiyaç Listesi'],['komisyon','Komisyon Onayı'],['fiyat','Fiyat Araştırma Formu'],['ym','Yaklaşık Maliyet Cetveli'],['onay','Onay Belgesi'],['teklif','Teklif Mektubu'],['piyasa','Piyasa Araştırma Tutanağı'],['muayene','Muayene / Kabul'],['teslim','Ödeme Belgesi Teslimi']];
function kontrol(a){
  const h=hesap(a), L=[], k=kur();
  const add=(lvl,msg,st)=>L.push({lvl,msg,st});
  if(!k.okul||!k.harcamaAd||!k.gercekAd) add('err','Kurum bilgileri eksik (okul adı, harcama yetkilisi veya gerçekleştirme görevlisi).','kurum');
  if(!k.kurumKodu) add('warn','DETSİS numarası girilmedi; evrak sayılarında kullanılır.','kurum');
  else if(!/^\d{8}$/.test(String(k.kurumKodu).trim())) add('warn',`DETSİS numarası (${k.kurumKodu}) 8 haneli bir sayı görünmüyor; kontrol edin.`,'kurum');
  const eksikNo=['ihtiyac','komisyon','fiyat','onay','harcama'].filter(x=>/-$/.test(String(a.sayi[x]||'').trim())).length;
  if(eksikNo) add('warn',`${eksikNo} belgenin sayısında EBYS evrak numarası eksik (sayı “-” ile bitiyor).`,5);
  if(!String(a.ad).trim()) add('err','İşin adı girilmedi.',0);
  if(DB.alimlar.some(x=>x!==a&&+x.yil===+a.yil&&+x.no===+a.no)) add('warn',`${dosyaNo(a)} numarası başka bir dosyada da kullanılıyor.`,0);
  if(!h.K.length) add('err','En az bir kalem girilmeli.',1);
  h.K.forEach(x=>{ if(!(x.m>0)) add('err',`“${x.ad}” kaleminin miktarı girilmedi.`,1); });
  if(a.teknikVar && h.K.some(x=>!String(x.teknik).trim())) add('warn','Teknik şartname düzenlenecek ama bazı kalemlerin teknik özelliği boş.',1);
  const kn={ym:a.kom.tek?'Yaklaşık maliyet ve satın alma komisyonu':'Yaklaşık maliyet komisyonu',pa:'Piyasa araştırma komisyonu',mk:'Muayene ve kabul komisyonu'};
  (a.kom.tek?['ym','mk']:['ym','pa','mk']).forEach(t=>{ if(a.kom[t].some(u=>!u.ad.trim())) add('warn',`${kn[t]}: boş üye adı var.`,2); });
  const mkN=a.kom.mk.filter(u=>u.ad.trim()).length; if(mkN && (mkN<3||mkN%2===0)) add('warn','Muayene ve kabul komisyonu en az 3 ve tek sayıda üyeden oluşmalıdır.',2);
  if(h.K.length){
    if(h.ymToplam<=0) add('err','Yaklaşık maliyet için fiyat girilmedi.',3);
    else { const az=h.ymK.filter(x=>x.n<3); if(az.length) add('warn',`${az.length} kalemde 3'ten az fiyat var; yaklaşık maliyet eldeki fiyatların ortalamasıyla hesaplandı.`,3); }
    if(a.usul==='22/d' && h.limit>0 && h.ymToplam>h.limit) add('err',`Yaklaşık maliyet (${tlx(h.ymToplam)}) 22/d limitini (${tlx(h.limit)}) aşıyor.`,3);
    if(num(a.odenek)>0 && h.ymToplam>0 && num(a.odenek)<h.odenekKdvli) add('warn',`Kullanılabilir ödenek (${tlx(num(a.odenek))}) KDV dahil yaklaşık maliyetin (${tlx(h.odenekKdvli)}) altında.`,0);
    if(!num(a.odenek)) add('warn','Kullanılabilir ödenek girilmedi.',0);
    const yarim=h.paT.filter(t=>!t.tam&&!t.bos); if(yarim.length) add('warn',`${yarim.length} teklif eksik fiyatlı; değerlendirmeye alınmadı.`,4);
    if(h.kaz<0) add('err','Değerlendirilebilir (tüm kalemleri fiyatlı) teklif yok.',4);
    else {
      if(!String(h.kf.ad).trim()) add('err','Seçilen firmanın adı boş.',4);
      if(h.esit) add('warn','En düşük teklifler eşit; ilk sıradaki firma seçildi. Gerekirse elle seçin.',4);
      if(!h.oto && h.aday.length && h.kazTop>Math.min(...h.aday.map(t=>t.top))) add('warn','Elle seçilen firma en düşük teklif sahibi değil; gerekçeyi Onay/Tutanak açıklamasına yazın.',4);
      if(h.ymToplam>0 && h.kazTop>h.ymToplam) add('warn','Kabul edilen teklif yaklaşık maliyetin üzerinde.',4);
      if(h.aday.length<3) add('warn',`Değerlendirilen teklif sayısı ${h.aday.length}.`,4);
    }
  }
  let onceki=null;
  TARIH_SIRA.forEach(([key,ad])=>{ const t=a.tarih[key]; if(!t){ add('warn',`${ad} tarihi girilmedi.`,5); return; } if(onceki&&t<onceki.t) add('err',`${ad} tarihi, ${onceki.ad} tarihinden önce olamaz.`,5); onceki={t,ad}; });
  h.kK.forEach(x=>{ if(x.kabulM>x.m) add('err',`“${x.ad}”: kabul edilen miktar sipariş miktarını aşıyor.`,6); if(x.kabulM<0) add('err',`“${x.ad}”: kabul miktarı negatif olamaz.`,6); });
  if(!a.kabul.kararNo) add('warn','Muayene/kabul karar (tutanak) numarası girilmedi.',6);
  return L;
}
function ilerleme(a){
  const h=hesap(a), t=Object.values(a.tarih);
  const s=[!!String(a.ad).trim(), h.K.length>0&&h.K.every(k=>k.m>0),
    (a.kom.tek?['ym','mk']:['ym','pa','mk']).every(x=>a.kom[x].every(u=>u.ad.trim())),
    h.ymToplam>0, h.kaz>=0, t.every(Boolean), !!a.kabul.kararNo];
  return s;
}

function renderSteps(){

   if(!h.K.length) return note('warn','Kalem yok.');

    parts.push(new Uint8Array(lh.buffer),nm,d);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,c,true); ch.setUint32(20,d.length,true); ch.setUint32(24,d.length,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm); off+=30+nm.length+d.length; });
  const cs=cen.reduce((s,x)=>s+x.length,0), e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);

  nesne(2,`<< /Type /Pages /Kids [${kids}] /Count ${N} >>`);
  imgs.forEach((im,i)=>{ const p=3+i*3, W=im.yatay?841.89:595.28, H=im.yatay?595.28:841.89, s=Math.min(W/im.w,H/im.h), dw=im.w*s, dh=im.h*s;

    nesne(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);
    nesne(p+1,`<< /Length ${icerik.length} >>\nstream\n${icerik}\nendstream`);
    nesne(p+2,`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`,im.data,'\nendstream'); });

}

function zenginKopyala(el){

/* -- ZIP okuyucu (xlsx için; tarayıcının yerleşik açıcısı kullanılır) -- */
async function zipAc(buf){
  const u=new Uint8Array(buf), dv=new DataView(buf), td=new TextDecoder();
  let e=u.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--; if(e<0) throw new Error('Geçerli bir Excel (.xlsx) dosyası değil.');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const F={};
  for(let i=0;i<n;i++){ const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    F[td.decode(u.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),o:dv.getUint32(p+42,true)}; p+=46+nl+xl+cl; }
  const oku=async ad=>{ const f=F[ad]; if(!f) return null; const s=f.o+30+dv.getUint16(f.o+26,true)+dv.getUint16(f.o+28,true), d=u.subarray(s,s+f.cs);
    if(f.m===0) return td.decode(d);
    if(typeof DecompressionStream==='undefined') throw new Error('Bu tarayıcı sıkıştırılmış Excel dosyasını açamıyor.');
    return td.decode(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); };
  return {ad:Object.keys(F),oku};
}
const harfSutun=r=>{ const m=String(r).match(/^[A-Z]+/); let n=0; for(const c of m?m[0]:'A') n=n*26+c.charCodeAt(0)-64; return n-1; };
async function xlsxSatirlar(buf){
  const z=await zipAc(buf), P=new DOMParser();
  let sayfa=z.ad.find(x=>/^xl\/worksheets\/sheet1\.xml$/.test(x))||z.ad.find(x=>/^xl\/worksheets\/.*\.xml$/.test(x));
  const ssx=await z.oku('xl/sharedStrings.xml'); const SS=ssx?[...P.parseFromString(ssx,'application/xml').getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const d=P.parseFromString(await z.oku(sayfa),'application/xml'); const rows=[];
  [...d.getElementsByTagName('row')].forEach(r=>{ const ri=(+r.getAttribute('r')||rows.length+1)-1; const row=[];
    [...r.getElementsByTagName('c')].forEach(c=>{ const t=c.getAttribute('t'), ci=harfSutun(c.getAttribute('r')||'A'), v=c.getElementsByTagName('v')[0];
      let val=''; if(t==='s') val=SS[+(v&&v.textContent)]??''; else if(t==='inlineStr') val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''); else if(t==='str'||t==='b') val=v?v.textContent:''; else val=v?(isNaN(+v.textContent)?v.textContent:+v.textContent):'';
      row[ci]=val; });
    rows[ri]=row; });
  return rows.map(r=>r||[]);
}
function xmlTabloSatirlar(text){ // XML Elektronik Tablo 2003 (.xls)
  const d=new DOMParser().parseFromString(text.replace(/^﻿/,''),'application/xml');
  if(d.getElementsByTagName('parsererror').length) throw new Error('Dosya okunamadı.');
  return [...d.getElementsByTagNameNS('*','Row')].map(r=>{ const row=[]; let ci=0;
    [...r.getElementsByTagNameNS('*','Cell')].forEach(c=>{ const ix=c.getAttribute('ss:Index')||c.getAttributeNS('urn:schemas-microsoft-com:office:spreadsheet','Index'); if(ix) ci=+ix-1;
      const dt=c.getElementsByTagNameNS('*','Data')[0]; row[ci]=dt?(dt.getAttribute('ss:Type')==='Number'?+dt.textContent:dt.textContent):''; ci++; });
    return row; });
}

/* -- MYS yaklaşık maliyet şablonu -- */
function mysAl(rows){
  const a=cur(), bas=rows.findIndex(r=>r.some(v=>/Ürün Adı/i.test(String(v)))); if(bas<0) throw new Error('MYS şablon başlığı (Ürün Adı …) bulunamadı.');
  const K=[], fiyat=[]; // fiyat: [{ki,vkn,tutar}]
  rows.slice(bas+1).forEach(r=>{ const ad=String(r[0]??'').trim();
    if(ad) K.push({ad,miktar:r[1],kod:String(r[2]??'').trim()});
    else if(K.length&&(r[6]!==''&&r[6]!=null)) fiyat.push({ki:K.length-1,vkn:String(r[7]??'').trim(),t:num(r[6])}); });
  if(!K.length) throw new Error('Şablonda kalem yok.');
  const mevcut=a.kalemler.filter(k=>String(k.ad).trim());
  let mod;
  if(!mevcut.length) mod='yeni';
  else if(mevcut.length===K.length&&a.kalemler.length===K.length) mod=confirm(`MYS şablonundaki ${K.length} kalem, uygulamadaki kalemlerle sırasıyla eşleştirilecek; MYS adları ve birim kodları kaydedilecek.\n\nTAMAM: Eşleştir\nİPTAL: Vazgeç`)?'esle':'';
  else mod=confirm(`MYS şablonunda ${K.length}, uygulamada ${mevcut.length} kalem var; sırayla eşleştirilemez.\n\nTAMAM: Kalemleri MYS şablonundakilerle değiştir (girilmiş fiyatlar silinir)\nİPTAL: Vazgeç`)?'yeni':'';
  if(!mod) return;
  if(mod==='yeni'){ a.kalemler=K.map(k=>({...bosKalem(),ad:k.ad,miktar:k.miktar===''?'':String(k.miktar).replace('.',','),birim:birimGeri(k.kod),mysAd:k.ad,mysBirim:k.kod})); [...a.ymF,...a.paF].forEach(f=>f.fiyat=[]); }
  else { let fark=0; K.forEach((k,i)=>{ const x=a.kalemler[i]; x.mysAd=k.ad; x.mysBirim=k.kod; if(k.miktar!==''&&num(k.miktar)!==num(x.miktar)) fark++; }); if(fark) setTimeout(()=>toast(`${fark} kalemin miktarı MYS ile uygulamada farklı; kontrol edin.`),2800); }
  let fn=0;
  if(fiyat.length&&confirm(`Şablonda ${fiyat.length} firma fiyatı da var. Yaklaşık maliyet fiyatlarına aktarılsın mı?`)){
    const vkns=[...new Set(fiyat.map(f=>f.vkn||'?'))];
    vkns.forEach(v=>{ let f=a.ymF.find(x=>String(x.vkn).trim()===v); if(!f){ f=a.ymF.find(x=>!String(x.ad).trim()&&!String(x.vkn).trim()&&!x.fiyat.some(Boolean)); if(!f){ f=firma(); a.ymF.push(f); } f.vkn=v==='?'?'':v; if(!f.ad) f.ad=v==='?'?'':`VKN ${v}`; }
      fiyat.filter(p=>(p.vkn||'?')===v).forEach(p=>{ f.fiyat[p.ki]=String(p.t).replace('.',','); fn++; }); });
  }
  touch(); render(); toast(`MYS şablonu alındı: ${K.length} kalem${fn?`, ${fn} fiyat`:''}.`);
}
async function disDosyaYukle(file,beklenen){
  const buf=await file.arrayBuffer(), u=new Uint8Array(buf.slice(0,4));
  try{
    if(u[0]===0x50&&u[1]===0x4B){ const rows=await xlsxSatirlar(buf);
      if(rows.some(r=>r.some(v=>/Ürün Adı/i.test(String(v))))) mysAl(rows);
      else if(rows.some(r=>r.some(v=>/İş Kaleminin Adı/i.test(String(v))))) ekapAl(rows,file.name);
      else throw new Error('Dosyada MYS veya EKAP kalem başlığı bulunamadı.'); }
    else { const t=new TextDecoder().decode(buf); if(!/urn:schemas-microsoft-com:office:spreadsheet/.test(t)) throw new Error(beklenen==='mys'?'MYS şablonu .xlsx olmalıdır.':'Bu dosya EKAP kalem listesi biçiminde değil. Eski .xls (ikili) dosyalar okunamaz; EKAP’tan indirilen dosyayı kullanın.');
      const rows=xmlTabloSatirlar(t); if(rows.some(r=>r.some(v=>/İş Kaleminin Adı/i.test(String(v))))) ekapAl(rows,file.name); else mysAl(rows); }
  }catch(e){ alert('Dosya alınamadı: '+e.message); }
}

  if(el.dataset.unvan){ const p=(DB.kurum.personel||[]).find(x=>x.ad.trim().toLocaleLowerCase('tr')===el.value.trim().toLocaleLowerCase('tr'));
    if(p&&!getVal(el.dataset.unvan)){ setVal(el.dataset.unvan,p.unvan); const t=$(`[data-b="${el.dataset.unvan}"]`); if(t) t.value=p.unvan; save(); } }
  if(rendering) return;
  if(el.dataset.b==='k:il'){ const k=DB.kurum, L=ILLER[k.il]||[]; if(k.ilce&&!L.includes(k.ilce)) k.ilce='';
    if(k.il){ const t=BUYUKSEHIR.has(k.il)?'buyuksehir':'diger'; if(k.limitTur!==t){ k.limitTur=t; toast(`22/d limiti “${t==='buyuksehir'?'Büyükşehir sınırları içi':'Diğer idareler'}” olarak ayarlandı.`); } } save(); }
  if(el.dataset.rr){ const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(el.dataset.b) renderSteps();
});

 home(){ view='home'; render(); window.scrollTo(0,0); }, kurum(){ view='kurum'; render(); window.scrollTo(0,0); }, rehber(){ view='rehber'; render(); window.scrollTo(0,0); },

 arsivle(el){ const a=el.dataset.id?DB.alimlar.find(x=>x.id===el.dataset.id):cur(); const e=kontrol(a).filter(x=>x.lvl==='err').length;
   if(!confirm(`“${dosyaEt(a)}” arşive kaldırılsın mı?${e?`\n\nDosyada ${e} hata görünüyor.`:''}\n\nArşivdeki dosya salt okunur olur; kurum bilgileri bu anki haliyle dosyaya kaydedilir.`)) return;
   a.arsiv=true; a.arsivTarih=Date.now(); a.kurumSnap=JSON.parse(JSON.stringify(DB.kurum)); save(); view='home'; render(); window.scrollTo(0,0); toast('Dosya arşive kaldırıldı.'); },
 arsivCik(el){ const a=el.dataset.id?DB.alimlar.find(x=>x.id===el.dataset.id):cur(); if(!confirm(`“${dosyaEt(a)}” arşivden çıkarılsın mı? Belgeler artık güncel kurum bilgileriyle üretilir.`)) return;

 omkl(el){ const a=cur(), k=el.dataset.k, m=omklM(a,k), nx={'+':'-','-':'/','/':'+'}[m]; a.omkl[k]=nx; touch(); const y=window.scrollY; render(); window.scrollTo(0,y); },

   if(!String(k.ad).trim()){ toast('Önce kalemin adını yazın.'); return; }

   k.teknik=teknikOrnek(k); if(t){ t.value=k.teknik; t.style.height='auto'; t.style.height=Math.min(320,t.scrollHeight+4)+'px'; t.focus(); t.setSelectionRange(t.value.length,t.value.length); }

 cbAc(el){ const inp=el.parentElement.querySelector('input'); const pop=$('#cbPop');
   if(!pop.classList.contains('hidden')&&CB.inp===inp){ cbKapat(); return; }
   const L=secenekler(inp.dataset.sec), v=inp.value.trim();
   pop.innerHTML=`<div class="ip">Listeden seçin veya kutuya kendiniz yazın</div>`+(L.length?L.map((o,i)=>`<button data-act="cbSec" data-i="${i}" class="${o.v===v?'on':''}">${esc(o.v)}${o.alt?`<small>${esc(o.alt)}</small>`:''}</button>`).join(''):`<div class="ip" style="border:0">Liste boş. ${inp.dataset.sec==='pers'?'Personeli Ayarlar sayfasından ekleyebilirsiniz.':''}</div>`);
   CB.inp=inp; CB.L=L; CB.t=Date.now(); pop.classList.remove('hidden');
   const r=inp.getBoundingClientRect(), w=Math.max(r.width,200), h=Math.min(280,pop.scrollHeight);
   let left=Math.min(r.left,window.innerWidth-w-8), top=r.bottom+4; if(top+h>window.innerHeight-70) top=Math.max(8,r.top-h-4);
   Object.assign(pop.style,{left:Math.max(8,left)+'px',top:top+'px',width:w+'px'});

const CB={inp:null,L:[],t:0};
function cbKapat(){ const p=$('#cbPop'); p.classList.add('hidden'); p.innerHTML=''; CB.inp=null; }
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('#cbPop,.cbt')) cbKapat(); },true);
window.addEventListener('scroll',e=>{ if(CB.inp&&e.target!==$('#cbPop')&&Date.now()-(CB.t||0)>500) cbKapat(); },true);
function kTasi(i,d){ const a=cur(), j=i+d; if(j<0||j>=a.kalemler.length) return; const sw=L=>{const t=L[i];L[i]=L[j];L[j]=t;}; sw(a.kalemler); [...a.ymF,...a.paF].forEach(f=>{ for(let x=f.fiyat.length;x<=Math.max(i,j);x++) f.fiyat[x]=f.fiyat[x]??''; sw(f.fiyat); }); touch(); render(); }
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  const f=ACT[el.dataset.act]; if(!f) return;
  if(kilitli()&&DEGISTIR.has(el.dataset.act)&&!(el.dataset.act==='set'&&String(el.dataset.p).startsWith('k:'))){ toast('Arşivdeki dosya salt okunur. Önce arşivden çıkarın.'); return; }

  e.stopPropagation(); f(el);
});
$('#fileX').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) disDosyaYukle(f,$('#fileX').dataset.m); });
$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); const v=j.veri||j; if(!v.kurum||!Array.isArray(v.alimlar)) throw 0;
    const mevcut=DB.alimlar.length; let mod='yaz';
    if(mevcut&&!confirm(`Yedekte ${v.alimlar.length} dosya var.\n\nTAMAM: Bu cihazdaki verilerin yerine yükle\nİPTAL: Mevcut dosyalara ekle`)) mod='ekle';
    if(mod==='yaz'){ DB={ver:1,kurum:merge(yeniKurum(),v.kurum),alimlar:v.alimlar.map(normAlim),aktif:null}; DB.kurum.kod=merge({...DOSYA_KOD},DB.kurum.kod); }
    else { const ids=new Set(DB.alimlar.map(x=>x.id)); v.alimlar.map(normAlim).forEach(x=>{ if(ids.has(x.id)) x.id=uid(); DB.alimlar.push(x); }); if(!DB.kurum.okul) DB.kurum=merge(yeniKurum(),v.kurum); }
    view='home'; save(); dirty=false; render(); toast('Yedek yüklendi.');
  }catch(err){ alert('Dosya okunamadı. Bu uygulamanın yedek dosyasını seçtiğinizden emin olun.'); } };
  r.readAsText(f,'utf-8');
});
document.addEventListener('toggle',e=>{ if(e.target.id==='arsivK'){ DB.arsivAcik=e.target.open; } },true);
window.addEventListener('beforeunload',e=>{ if(memOnly&&dirty&&DB.alimlar.length){ e.preventDefault(); e.returnValue=''; } });

load();
if(DB.aktif&&cur()) view='alim';
render();
