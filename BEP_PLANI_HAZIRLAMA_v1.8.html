<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>BEP Planı Hazırlama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Comic+Neue:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ============ TASARIM TOKENLARI ============ */
:root{
  --zemin:#F7F3EA;         /* defter kağıdı zemin */
  --panel:#FFFFFF;
  --koyu:#1E3B34;          /* koyu çam yeşili - ana kurumsal renk */
  --koyu-2:#16302A;
  --koyu-3:#0F211D;
  --vurgu:#B0722A;         /* kahve/hardal - mühür rengi vurgu */
  --vurgu-2:#8A5920;
  --vurgu-soft:#F1E3CE;
  --cizgi:#E1D9C4;
  --cizgi-koyu:#CBBF9E;
  --metin:#241F17;
  --metin-soft:#6B6252;
  --kirmizi:#A93B2B;
  --yesil-basari:#3E6B4F;
}
*{box-sizing:border-box;}
body{
  background:var(--zemin);
  color:var(--metin);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.font-display{font-family:'Fraunces',serif;}
/* Modül yazı tipi (isteğe bağlı, her modül kendi seçimi) */
.yazi-tipi-cubuk{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  margin:0 0 12px; padding:8px 12px; border-radius:10px;
  background:var(--vurgu-soft, #f5f0e8); border:1px solid var(--cizgi, #e5dfd3);
}
.yazi-tipi-cubuk .yt-label{font-size:12px; font-weight:700; color:var(--koyu-3, #3e3428); margin-right:4px;}
.yazi-tipi-cubuk button.yt-btn{
  font-size:12px; font-weight:600; padding:4px 10px; border-radius:8px;
  border:1px solid var(--cizgi-koyu, #cfc6b6); background:#fff; color:var(--metin, #333); cursor:pointer;
}
.yazi-tipi-cubuk button.yt-btn.aktif{
  background:var(--koyu-3, #3e3428); color:#fff; border-color:var(--koyu-3, #3e3428);
}
#icerik-alani.yazi-cocuk,
#icerik-alani.yazi-cocuk input,
#icerik-alani.yazi-cocuk select,
#icerik-alani.yazi-cocuk textarea,
#icerik-alani.yazi-cocuk button,
#icerik-alani.yazi-cocuk .form-input,
#icerik-alani.yazi-cocuk .panel-baslik,
#icerik-alani.yazi-cocuk p,
#icerik-alani.yazi-cocuk td,
#icerik-alani.yazi-cocuk th,
#icerik-alani.yazi-cocuk label,
#icerik-alani.yazi-cocuk li,
#icerik-alani.yazi-cocuk span{
  font-family:'Comic Neue','Andika', 'Segoe UI', Tahoma, sans-serif !important;
}
#icerik-alani.yazi-andika,
#icerik-alani.yazi-andika input,
#icerik-alani.yazi-andika select,
#icerik-alani.yazi-andika textarea,
#icerik-alani.yazi-andika button,
#icerik-alani.yazi-andika .form-input,
#icerik-alani.yazi-andika .panel-baslik,
#icerik-alani.yazi-andika p,
#icerik-alani.yazi-andika td,
#icerik-alani.yazi-andika th,
#icerik-alani.yazi-andika label,
#icerik-alani.yazi-andika li,
#icerik-alani.yazi-andika span{
  font-family:'Andika','Comic Neue', 'Segoe UI', Tahoma, sans-serif !important;
}


/* Nav modül ipucu — tıklamayı engellemez */
#nav-ipucu{
  display:none; position:fixed; z-index:10050;
  max-width:280px; padding:10px 12px;
  border-radius:10px; font-size:12.5px; line-height:1.45;
  background:#0f211d; color:#f7f3ea;
  border:1px solid rgba(176,114,42,.45);
  box-shadow:0 8px 24px rgba(0,0,0,.28);
  pointer-events:none !important;
  font-family:Inter,system-ui,sans-serif;
}
#nav-ipucu .ni-baslik{ font-weight:700; font-size:13px; color:#f1e3ce; margin-bottom:4px; }
#nav-ipucu.acik{ display:block; }

/* Buton / eylem ipuçları — yalnızca hover destekleyen cihazlarda */
#btn-ipucu{
  display:none; position:fixed; z-index:10060;
  max-width:min(300px, calc(100vw - 24px)); padding:10px 12px;
  border-radius:10px; font-size:12.5px; line-height:1.45;
  background:#0f211d; color:#f7f3ea;
  border:1px solid rgba(176,114,42,.45);
  box-shadow:0 8px 24px rgba(0,0,0,.28);
  pointer-events:none !important;
  font-family:Inter,system-ui,sans-serif;
  text-align:left;
}
#btn-ipucu .bi-baslik{ font-weight:700; font-size:13px; color:#f1e3ce; margin-bottom:4px; }
#btn-ipucu.acik{ display:block; }
@media (hover: none), (pointer: coarse){
  #btn-ipucu{ display:none !important; }
}

::selection{background:var(--vurgu-soft);}

/* ============ SEKME NAVİGASYON ============ */
.nav-group-title{
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:rgba(247,243,234,.45); padding:14px 16px 6px;
}
.nav-tab{
  display:flex; align-items:center; gap:10px;
  padding:9px 14px 9px 16px; margin:1px 8px;
  border-radius:6px;
  color:rgba(247,243,234,.82);
  font-size:13.5px; font-weight:500;
  cursor:pointer; position:relative;
  transition:background .15s, color .15s;
  border-left:3px solid transparent;
}
.nav-tab:hover{background:rgba(247,243,234,.06); color:#fff;}
.nav-tab.active{
  background:var(--zemin); color:var(--koyu-3);
  border-left:3px solid var(--vurgu);
  font-weight:600;
}
.nav-tab.disabled{opacity:.38; cursor:default;}
.nav-tab.disabled:hover{background:transparent; color:rgba(247,243,234,.82);}
.badge-soon{
  font-size:9.5px; font-weight:700; letter-spacing:.03em;
  background:rgba(247,243,234,.12); color:rgba(247,243,234,.7);
  padding:1px 6px; border-radius:20px; margin-left:auto;
}

/* ============ İÇERİK KARTLARI ============ */
.evrak-panel{
  background:var(--panel);
  border:1px solid var(--cizgi);
  border-radius:8px;
  box-shadow:0 1px 2px rgba(30,25,15,.05);
}

.mod-ipucu{
  display:flex; gap:8px; align-items:flex-start;
  margin:8px 0 14px; padding:9px 12px;
  border-radius:10px; font-size:12.5px; line-height:1.45;
  background:rgba(201,162,39,.12); border:1px solid rgba(201,162,39,.28);
  color:var(--metin);
}
.mod-ipucu i{ color:var(--vurgu); margin-top:2px; flex-shrink:0; }
.mod-ipucu b{ font-weight:600; }

.panel-baslik{
  font-family:'Fraunces',serif; font-weight:600; font-size:20px;
  color:var(--koyu-3); letter-spacing:-.01em;
}
.form-label{
  font-size:12px; font-weight:600; color:var(--metin-soft);
  letter-spacing:.02em; margin-bottom:4px; display:block;
}
.form-input{
  width:100%; border:1.5px solid var(--cizgi-koyu); border-radius:7px;
  padding:8px 11px; font-size:14px; background:#fff; color:var(--metin);
  transition:border-color .15s, box-shadow .15s;
}
.form-input:focus{
  outline:none; border-color:var(--koyu); box-shadow:0 0 0 3px rgba(30,59,52,.10);
}
.btn-primary{
  background:var(--koyu); color:#fff; font-weight:600; font-size:13.5px;
  padding:9px 16px; border-radius:7px; display:inline-flex; align-items:center; gap:7px;
  transition:background .15s, transform .1s;
}
.btn-primary:hover{background:var(--koyu-2);}
.btn-primary:active{transform:scale(.98);}
.btn-secondary{
  background:#fff; color:var(--koyu-3); font-weight:600; font-size:13.5px;
  padding:9px 16px; border-radius:7px; border:1.5px solid var(--cizgi-koyu);
  display:inline-flex; align-items:center; gap:7px; transition:border-color .15s, background .15s;
}
.btn-secondary:hover{border-color:var(--koyu); background:var(--vurgu-soft);}
.btn-vurgu{
  background:var(--vurgu); color:#fff; font-weight:600; font-size:13.5px;
  padding:9px 16px; border-radius:7px; display:inline-flex; align-items:center; gap:7px;
  transition:background .15s;
}
.btn-vurgu:hover{background:var(--vurgu-2);}

/* Yazdır / Önizleme — tüm modüllerde belirgin */
.btn-yazdir,
button.btn-secondary:has(.fa-print),
button.btn-vurgu:has(.fa-print),
button.btn-primary:has(.fa-print){
  background:#0f766e !important;
  color:#fff !important;
  border:1.5px solid #0d9488 !important;
  box-shadow:0 1px 2px rgba(15,118,110,.25);
}
.btn-yazdir:hover,
button.btn-secondary:has(.fa-print):hover,
button.btn-vurgu:has(.fa-print):hover,
button.btn-primary:has(.fa-print):hover{
  background:#0d9488 !important;
  border-color:#14b8a6 !important;
  color:#fff !important;
}
button:has(.fa-print) i.fa-print{ color:#fff !important; }

.print-eye-btn{
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  width:36px !important;
  height:36px !important;
  margin-left:4px;
  border-radius:999px !important;
  border:1.5px solid #d97706 !important;
  background:#f59e0b !important;
  color:#fff !important;
  cursor:pointer;
  vertical-align:middle;
  flex-shrink:0;
  box-shadow:0 1px 3px rgba(217,119,6,.35);
  transition:background .15s, transform .1s;
}
.print-eye-btn:hover{
  background:#fbbf24 !important;
  border-color:#f59e0b !important;
  color:#78350f !important;
  transform:scale(1.05);
}
.print-eye-btn:active{ transform:scale(.96); }
.print-eye-btn i{ color:inherit !important; pointer-events:none; }

.btn-pdf,
.print-edit-btn,.print-pdf-btn{
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:36px;
  height:36px;
  padding:0 12px;
  margin-left:4px;
  border-radius:8px !important;
  border:1.5px solid #1d4ed8 !important;
  background:#2563eb !important;
  color:#fff !important;
  font-weight:600;
  font-size:12.5px;
  cursor:pointer;
  vertical-align:middle;
  flex-shrink:0;
  box-shadow:0 1px 3px rgba(37,99,235,.35);
  transition:background .15s, transform .1s;
}
.print-pdf-btn.icon-only{
  width:36px;
  padding:0;
  border-radius:999px !important;
}
.btn-pdf:hover,
.print-edit-btn:hover,.print-pdf-btn:hover{
  background:#3b82f6 !important;
  border-color:#60a5fa !important;
  color:#fff !important;
  transform:scale(1.03);
}
.print-pdf-btn i{ color:#fff !important; pointer-events:none; }


.btn-danger-ghost{
  color:var(--kirmizi); font-weight:600; font-size:12.5px;
  display:inline-flex; align-items:center; gap:5px;
}
.icon-btn{
  width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:7px; color:var(--metin-soft); transition:background .15s, color .15s;
}
.icon-btn:hover{background:var(--vurgu-soft); color:var(--koyu-3);}

.tag-pill{
  font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px;
  letter-spacing:.02em;
}

/* boş durum */
.bos-durum{
  border:1.5px dashed var(--cizgi-koyu); border-radius:10px;
  padding:40px 20px; text-align:center; color:var(--metin-soft);
}

/* ============ YAZDIRMA / EVRAK SAYFASI MİMARİSİ ============
   Tüm modüller #print-root üzerinden yazar. Ekranda gizli; yazdırmada
   body'nin diğer çocukları gizlenir, sadece #print-root görünür. */
.evrak-sayfa{
  width:21cm; min-height:29.7cm; padding:1.5cm 1.6cm;
  background:#fff; color:#111; font-family:'Inter',sans-serif;
  margin:0 auto; box-sizing:border-box;
}
.evrak-baslik-blok{ text-align:center; margin-bottom:14px; }
.evrak-baslik-blok h1{ font-size:14pt; font-weight:700; letter-spacing:.02em; }
.evrak-baslik-blok h2{ font-size:12pt; font-weight:600; margin-top:2px; }
.evrak-tablo{ width:100%; border-collapse:collapse; font-size:10.5pt; }
.evrak-tablo th, .evrak-tablo td{ border:1px solid #333; padding:5px 8px; text-align:left; }
.evrak-tablo th{ background:#EFEFEF; font-weight:700; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.evrak-imza-alani{ display:flex; justify-content:space-between; margin-top:36px; }
.evrak-imza-kutu{ text-align:center; width:220px; font-size:10.5pt; }
.evrak-imza-kutu .cizgi{ border-top:1px solid #333; margin-top:38px; padding-top:4px; }

.evrak-sayfa.yatay{ width:29.7cm; min-height:21cm; page:yatay; }

#print-root{
  display:none;
  background:#fff;
  color:#111;
}

@media print{
  @page{ size:A4 portrait; margin:12mm; }
  @page yatay{ size:A4 landscape; margin:10mm; }

  html, body{
    background:#fff !important;
    margin:0 !important;
    padding:0 !important;
    height:auto !important;
    overflow:visible !important;
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
  }

  /* Uygulama arayüzünü tamamen gizle; sadece yazdırma kökü kalsın */
  body > *:not(#print-root){
    display:none !important;
  }

  #print-root{
    display:block !important;
    position:static !important;
    width:100% !important;
    margin:0 !important;
    padding:0 !important;
    background:#fff !important;
    visibility:visible !important;
  }
  #print-root *{
    visibility:visible !important;
  }

  .evrak-sayfa{
    margin:0 auto !important;
    box-shadow:none !important;
    page-break-after:always;
    break-after:page;
  }
  .evrak-sayfa:last-child{
    page-break-after:auto;
    break-after:auto;
  }
}

@media (max-width: 767px){
  .evrak-sayfa{ width:100%; padding:1cm; }
}

/* BEP plan satırları — kompakt accordion */
.bep-plan-satir{
  border:1px solid var(--cizgi);
  border-radius:8px;
  margin-bottom:6px;
  background:#fff;
  overflow:hidden;
}
.bep-plan-satir-baslik{
  display:flex; align-items:flex-start; gap:8px;
  padding:8px 10px; cursor:pointer;
  background:var(--panel);
  user-select:none;
}
.bep-plan-satir-baslik:hover{ background:var(--vurgu-soft); }
.bep-plan-satir.acik .bep-plan-satir-baslik{ border-bottom:1px solid var(--cizgi); }
.bep-plan-satir-govde{
  display:none; padding:8px 10px 10px;
}
.bep-plan-satir.acik .bep-plan-satir-govde{ display:block; }
.bep-plan-satir .form-label{ font-size:11px; margin-bottom:2px; }
.bep-plan-satir .form-input{ padding:5px 8px; font-size:12.5px; border-radius:5px; }
.bep-plan-satir textarea.form-input{ min-height:0; line-height:1.35; }
.bep-plan-grid{ display:grid; gap:6px; }
.bep-plan-grid-3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.bep-plan-grid-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
@media (max-width:640px){
  .bep-plan-grid-3, .bep-plan-grid-2{ grid-template-columns:1fr; }
}
/* Sol panel daraltma */
#sidebar.dar{
  width:56px !important;
  overflow:hidden;
}
#sidebar.dar .sidebar-genis{ display:none !important; }
#sidebar.dar .sidebar-dar-ikon{ display:flex !important; }
#sidebar.dar #nav-container{ display:none; }
#sidebar.dar #nav-ogretmen-ozet, #sidebar.dar #nav-iletisim{ display:none; }
.sidebar-dar-ikon{ display:none; flex-direction:column; align-items:center; gap:8px; padding:8px 0; }
#sidebar-toggle-btn{
  position:absolute; top:12px; left:0; z-index:30;
  width:22px; height:36px; border-radius:0 6px 6px 0;
  background:var(--koyu-3); color:#fff; border:none; cursor:pointer;
  display:none; align-items:center; justify-content:center;
  font-size:11px; box-shadow:1px 1px 4px rgba(0,0,0,.15);
}
/* Tek sayfa düzeni: tüm ekranlarda sayfa normal kayar (iç kaydırma kutusu yok) */
html, body{ height:auto; overflow-x:hidden; overflow-y:auto; }
#ana-icerik{ height:auto; max-height:none; overflow:visible; }
#icerik-alani{ padding-bottom:96px; }
@media (max-width:767px){
  html, body{ height:auto; overflow:auto; }
  #app-shell{ height:auto; max-height:none; overflow:visible; }
  #ana-icerik{ height:auto; max-height:none; overflow:visible; }
}


.bep-ms{ position:relative; }
.bep-ms-btn{
  width:100%; text-align:left; border:1.5px solid var(--cizgi-koyu); border-radius:5px;
  padding:5px 8px; font-size:12.5px; background:#fff; color:var(--metin);
  cursor:pointer; min-height:30px; display:flex; flex-wrap:wrap; gap:3px; align-items:center;
}
.bep-ms-btn:hover{ border-color:var(--koyu); }
.bep-ms-chip{
  display:inline-flex; align-items:center; gap:3px;
  background:var(--vurgu-soft); color:var(--koyu-3); font-size:11px; font-weight:600;
  padding:1px 6px; border-radius:10px; max-width:100%;
}
.bep-ms-chip button{ border:0; background:transparent; cursor:pointer; color:var(--metin-soft); font-size:10px; padding:0 1px; line-height:1; }
.bep-ms-menu{
  display:none; position:absolute; z-index:40; left:0; right:0; top:100%; margin-top:2px;
  max-height:180px; overflow-y:auto; background:#fff;
  border:1.5px solid var(--cizgi-koyu); border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.12);
  padding:4px 0;
}
.bep-ms.open .bep-ms-menu{ display:block; }
.bep-ms-item{
  display:flex; align-items:center; gap:7px; padding:5px 10px; font-size:12px; cursor:pointer;
}
.bep-ms-item:hover{ background:var(--vurgu-soft); }
.bep-ms-item input{ accent-color:var(--koyu); }
.bep-ms-placeholder{ color:var(--metin-soft); font-size:12px; }


/* Genel modül accordion (tutanak, rehberlik vb.) */
.mod-acc{
  border:1px solid var(--cizgi);
  border-radius:8px;
  margin-bottom:6px;
  background:#fff;
  overflow:hidden;
}
.mod-acc-baslik{
  display:flex; align-items:flex-start; gap:8px;
  padding:8px 10px; cursor:pointer; user-select:none;
  background:var(--panel);
}
.mod-acc-baslik:hover{ background:var(--vurgu-soft); }
.mod-acc.acik .mod-acc-baslik{ border-bottom:1px solid var(--cizgi); }
.mod-acc-govde{ display:none; padding:8px 10px 10px; }
.mod-acc.acik .mod-acc-govde{ display:block; }
.mod-acc .form-label{ font-size:11px; margin-bottom:2px; }
.mod-acc .form-input{ padding:5px 8px; font-size:12.5px; border-radius:5px; }
.mod-acc textarea.form-input{ line-height:1.35; }


#sidebar-profil-listesi .profil-chip{
  display:block; width:100%; text-align:left;
  padding:6px 10px; border-radius:8px; font-size:12px; font-weight:500;
  color:rgba(247,243,234,.7); background:transparent; border:1px solid transparent;
  transition:background .15s, color .15s;
}
#sidebar-profil-listesi button.profil-chip:hover{
  background:rgba(255,255,255,.08); color:#fff;
}
#sidebar-profil-listesi .profil-chip.aktif{
  background:rgba(201,162,39,.22); color:#fff;
  border-color:rgba(201,162,39,.45); font-weight:600;
}
#sidebar-profil-listesi .profil-degistir-btn{
  background:var(--vurgu); color:#fff; border-color:var(--vurgu);
  font-weight:600; margin-top:4px;
}
#sidebar-profil-listesi .profil-degistir-btn:hover{
  background:var(--vurgu-2); color:#fff;
}


.aktif-profil-banner{
  text-align:center;
  padding:10px 16px 6px;
  font-family:var(--font-display, inherit);
  font-weight:700;
  font-size:15px;
  letter-spacing:.02em;
  color:var(--koyu-3);
  border-bottom:1px solid var(--cizgi);
  background:linear-gradient(180deg, rgba(201,162,39,.12), transparent);
}
.aktif-profil-banner span{
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.aktif-profil-banner .profil-nokta{
  width:8px; height:8px; border-radius:50%;
  background:var(--vurgu); display:inline-block;
}
@media print{
  .aktif-profil-banner{ display:none !important; }
}

/* Sabit geri butonu — kaydırırken de görünür */
#geri-btn{
  position:fixed; z-index:90;
  left:16px; bottom:20px;
  width:46px; height:46px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
  background:var(--koyu); color:#fff; border:none; cursor:pointer;
  box-shadow:0 4px 14px rgba(15,33,29,.28);
  transition:transform .12s, background .15s, opacity .15s;
}
#geri-btn:hover{ background:var(--koyu-2); transform:scale(1.05); }
#geri-btn:active{ transform:scale(.96); }
#geri-btn i{ font-size:16px; }
@media (min-width:768px){
  #geri-btn{ left:calc(268px + 16px); }
  #sidebar.dar ~ * #geri-btn, body.sidebar-dar #geri-btn{ left:72px; }
}
@media print{
  #geri-btn{ display:none !important; }
}

  font-size:12.5px; font-weight:600; color:#fff; background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18); cursor:pointer; white-space:nowrap; }
.ust-btn:hover{ background:rgba(255,255,255,.18); }
</style>
</head>
<body class="min-h-screen">

<!-- ============ ÜST ÇUBUK ============ -->
<header id="ust-cubuk" class="sticky top-0 z-40" style="background:var(--koyu-3); color:#fff;">
  <div class="max-w-[980px] mx-auto px-4 md:px-8 py-3 flex items-center justify-between gap-3 flex-wrap">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background:var(--vurgu);">
        <i class="fa-solid fa-puzzle-piece text-white text-[15px]"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-semibold text-[16px] leading-tight truncate">BEP Planı Hazırlama</div>

      </div>

<main id="ana-icerik">
  <div id="icerik-alani" class="max-w-[980px] mx-auto px-4 md:px-8 py-6 md:py-8"></div>
</main>

<!-- ============ YAZDIRMA KÖKÜ ============ -->
<div id="print-root"></div>

<script>
/* ==========================================================================
   BEP PLANI HAZIRLAMA — tek modüllü sürüm
   Öğrenci, öğretmen ve okul bilgileri BEP sayfasında doldurulur.
   Veriler tarayıcıda (localStorage) saklanır; önceki sürümün kayıtları korunur.
   ========================================================================== */
const APP_VERSION = '1.8';
const STORAGE_KEY = 'ogretmenAsistaniV1';
const VERSION_KEY = 'ogretmenAsistaniAppVersion';
const YEDEK_TARIH_KEY = 'ogretmenAsistaniSonYedek';
const YEDEK_ERTELE_KEY = 'ogretmenAsistaniYedekErtele';
const PROFILE_META_KEY = 'oa_profilListesi';
const ACTIVE_PROFILE_KEY = 'oa_aktifProfilId';
let aktifProfilId = null;

function profilListesiAl(){
  try{
    const h = localStorage.getItem(PROFILE_META_KEY);
    if(h){ const a = JSON.parse(h); if(Array.isArray(a)) return a; }
  }catch(e){}
  return [];
}
function profilListesiYaz(liste){
  try{ localStorage.setItem(PROFILE_META_KEY, JSON.stringify(liste)); }catch(e){}
}
function profilDepoAnahtari(pid){ return STORAGE_KEY + '__' + pid; }
function profilSurumAnahtari(pid){ return VERSION_KEY + '__' + pid; }
function profilYedekTarihAnahtari(pid){ return YEDEK_TARIH_KEY + '__' + pid; }
function profilYedekErteleAnahtari(pid){ return YEDEK_ERTELE_KEY + '__' + pid; }
function yeniProfilId(){
  return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
}
/** Önceki sürümlerdeki kayıtları bulur; yoksa tek bir depo açar. */
function profilMigrasyon(){
  let liste = profilListesiAl();
  let eskiHam = null;
  try{ eskiHam = localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(liste.length === 0){
    const id = yeniProfilId();
    liste = [{id, ad:'BEP', olusturma: new Date().toISOString()}];
    profilListesiYaz(liste);
    if(eskiHam){
      try{
        localStorage.setItem(profilDepoAnahtari(id), eskiHam);
        localStorage.removeItem(STORAGE_KEY);
      }catch(err){}
    }
    aktifProfilId = id;
    try{ localStorage.setItem(ACTIVE_PROFILE_KEY, id); }catch(e){}
  } else {
    try{ aktifProfilId = localStorage.getItem(ACTIVE_PROFILE_KEY); }catch(e){ aktifProfilId = null; }
    if(!aktifProfilId || !liste.some(p => p.id === aktifProfilId)){
      aktifProfilId = liste[0].id;
      try{ localStorage.setItem(ACTIVE_PROFILE_KEY, aktifProfilId); }catch(e){}
    }
  }
}

const KADEME_LISTESI = ['Okul Öncesi','İlkokul','Ortaokul','İmam Hatip Ortaokulu','Lise / Ortaöğretim','Mesleki ve Teknik Eğitim','İmam Hatip Lisesi','Özel Eğitim','Halk Eğitimi / Yaygın Eğitim'];

/* 2026-2027 MEB çalışma takvimi — BEP tarih dağıtımında tatilleri atlamak için */
const MEB_TAKVIM_2026_2027 = {
  donem1Baslangic: '2026-09-14', donem1Bitis: '2027-01-22',
  donem1AraTatilBaslangic: '2026-11-16', donem1AraTatilBitis: '2026-11-20',
  yariyilTatiliBaslangic: '2027-01-25', yariyilTatiliBitis: '2027-02-05',
  donem2Baslangic: '2027-02-08', donem2Bitis: '2027-06-25',
  donem2AraTatilBaslangic: '2027-03-08', donem2AraTatilBitis: '2027-03-12',
  resmiTatiller: [
    {ad:'Cumhuriyet Bayramı Arifesi (yarım gün)', tarih:'2026-10-28'},
    {ad:'Cumhuriyet Bayramı', tarih:'2026-10-29'},
    {ad:'Yılbaşı Tatili', tarih:'2027-01-01'},
    {ad:'Ramazan Bayramı Arifesi', tarih:'2027-03-08'},
    {ad:'Ramazan Bayramı 1. Günü', tarih:'2027-03-09'},
    {ad:'Ramazan Bayramı 2. Günü', tarih:'2027-03-10'},
    {ad:'Ramazan Bayramı 3. Günü', tarih:'2027-03-11'},
    {ad:'Ulusal Egemenlik ve Çocuk Bayramı', tarih:'2027-04-23'},
    {ad:'İşçi Bayramı', tarih:'2027-05-01'},
    {ad:'Kurban Bayramı Arifesi', tarih:'2027-05-15'},
    {ad:'Kurban Bayramı 1. Günü', tarih:'2027-05-16'},
    {ad:'Kurban Bayramı 2. Günü', tarih:'2027-05-17'},
    {ad:'Kurban Bayramı 3. Günü', tarih:'2027-05-18'},
    {ad:'Atatürk\'ü Anma, Gençlik ve Spor Bayramı', tarih:'2027-05-19'},
    {ad:'Demokrasi ve Millî Birlik Günü', tarih:'2027-07-15'},
    {ad:'Zafer Bayramı', tarih:'2027-08-30'},
  ]
};

function bosState(){
  return {
    modulYaziTipi:{},
    ayarlar:{
      kademe:'Ortaokul',
      okulAdi:'', egitimOgretimYili:'2026-2027',
      ogretmenAdi:'', brans:'', mudurAdi:'', okulMuduruUnvani:'Okul Müdürü'
    },
    bepDosyalari:[],
    aktifBepId:null,
    aktifModul:'bepPlani'
  };
}

let state = bosState();

function kaydet(){
  try{
    if(!aktifProfilId) profilMigrasyon();
    if(!aktifProfilId) return false;
    state.appVersion = APP_VERSION;
    localStorage.setItem(profilDepoAnahtari(aktifProfilId), JSON.stringify(state));
    localStorage.setItem(profilSurumAnahtari(aktifProfilId), APP_VERSION);
    return true;
  }catch(e){
    console.error('Kaydetme hatası', e);
    const msg = (e && e.name === 'QuotaExceededError')
      ? 'Depolama dolu. JSON yedek alıp gereksiz BEP dosyalarını silin.'
      : 'Kayıt yapılamadı: ' + (e && e.message ? e.message : e);
    try{ bildirimGoster(msg, true); }catch(_e){}
    return false;
  }
}

/** Eski kaydı yeni iskeletle birleştir — kullanıcı verisi korunur */
function yukleBirlesik(eski){
  const temiz = bosState();
  if(!eski || typeof eski !== 'object') return temiz;
  Object.keys(eski).forEach(function(k){
    if(k === 'appVersion') return;
    const v = eski[k];
    if(v === undefined) return;
    if(k === 'ayarlar' && v && typeof v === 'object' && !Array.isArray(v)){
      temiz.ayarlar = Object.assign({}, temiz.ayarlar, v);
      return;
    }
    temiz[k] = v;
  });
  temiz.aktifModul = 'bepPlani';
  if(!Array.isArray(temiz.bepDosyalari)) temiz.bepDosyalari = [];
  temiz.bepDosyalari.forEach(function(b){ try{ bepDosyaTaniNormalize(b); }catch(_e){} });
  return temiz;
}

function yukle(){
  try{
    profilMigrasyon();
    if(!aktifProfilId){ state = bosState(); return; }
    const ham = localStorage.getItem(profilDepoAnahtari(aktifProfilId));
    let eski = null;
    if(ham){
      try{ eski = JSON.parse(ham); }catch(parseErr){
        try{ localStorage.setItem(profilDepoAnahtari(aktifProfilId) + '__bozuk_' + Date.now(), ham); }catch(_e){}
      }
    }
    state = eski ? yukleBirlesik(eski) : bosState();
    state.appVersion = APP_VERSION;
    kaydet();
  }catch(e){
    console.error('Yükleme hatası', e);
    state = bosState();
  }
}

/* ============ YEDEKLEME (JSON) ============ */
function bugunISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function yedekDosyaAdiGuvenli(ad){
  return String(ad||'BEP').trim().replace(/\s+/g,'_').replace(/[<>:"/\\|?*\x00-\x1F]/g,'').replace(/_+/g,'_').slice(0,60) || 'BEP';
}
function yedekSonTarih(){
  try{ return localStorage.getItem(profilYedekTarihAnahtari(aktifProfilId)) || ''; }catch(e){ return ''; }
}
function yedekErteleTarih(){
  try{ return localStorage.getItem(profilYedekErteleAnahtari(aktifProfilId)) || ''; }catch(e){ return ''; }
}
function yedekGerekliMi(){
  if(!(state.bepDosyalari||[]).length) return false;
  const bugun = bugunISO();
  return yedekSonTarih() !== bugun && yedekErteleTarih() !== bugun;
}
function yedekIndir(){
  try{
    kaydet();
    const paket = { uygulama:'BEP Planı Hazırlama', surum:APP_VERSION, yedekTarihi:new Date().toISOString(), state:state };
    const blob = new Blob([JSON.stringify(paket, null, 2)], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ad = yedekDosyaAdiGuvenli(state.ayarlar && (state.ayarlar.ogretmenAdi || state.ayarlar.okulAdi));
    a.href = url;
    a.download = 'BEP_PLANI_v' + APP_VERSION + '_' + ad + '_' + bugunISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    try{ localStorage.setItem(profilYedekTarihAnahtari(aktifProfilId), bugunISO()); }catch(e){}
    const bn = document.getElementById('yedek-hatirlat-banner'); if(bn) bn.remove();
    bildirimGoster('Yedek indirildi.');
  }catch(e){
    console.error(e);
    bildirimGoster('Yedek alınamadı.', true);
  }
}
function yedekYukle(input){
  const file = input && input.files && input.files[0];
  if(!file) return;
  if(!confirm('Yedekten geri yükleme mevcut verinin üzerine yazacak. Devam edilsin mi?')){ input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const ham = JSON.parse(ev.target.result);
      const gelen = ham.state ? ham.state : ham;
      if(!gelen || typeof gelen !== 'object'){ bildirimGoster('Geçersiz yedek dosyası.', true); return; }
      state = yukleBirlesik(gelen);
      if(!state.aktifBepId && state.bepDosyalari.length) state.aktifBepId = state.bepDosyalari[0].id;
      kaydet();
      try{ localStorage.setItem(profilYedekTarihAnahtari(aktifProfilId), bugunISO()); }catch(e){}
      render({scrollTop:true});
      bildirimGoster('Yedek geri yüklendi (' + state.bepDosyalari.length + ' BEP dosyası).');
    }catch(err){
      console.error(err);
      bildirimGoster('Yedek okunamadı. Dosya bozuk olabilir.', true);
    }
    input.value = '';
  };
  reader.onerror = function(){ bildirimGoster('Dosya okunamadı.', true); input.value = ''; };
  reader.readAsText(file, 'UTF-8');
}
function yedekHatirlatErtele(){
  try{ localStorage.setItem(profilYedekErteleAnahtari(aktifProfilId), bugunISO()); }catch(e){}
  const b = document.getElementById('yedek-hatirlat-banner');
  if(b) b.remove();
}
function yedekHatirlatBannerGoster(){
  if(!yedekGerekliMi()) return;
  if(document.getElementById('yedek-hatirlat-banner')) return;
  const div = document.createElement('div');
  div.id = 'yedek-hatirlat-banner';
  div.style.cssText = 'position:fixed;bottom:16px;right:16px;left:16px;margin-left:auto;z-index:90;max-width:340px;background:#1e293b;color:#fff;padding:14px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;line-height:1.45;';
  const son = yedekSonTarih();
  div.innerHTML = `
    <div style="font-weight:700;margin-bottom:6px;"><i class="fa-solid fa-cloud-arrow-down" style="margin-right:6px;"></i>Günlük yedek hatırlatması</div>
    <div style="opacity:.9;margin-bottom:10px;">${son ? 'Son yedek: <b>'+escapeHtml(son)+'</b>. Bugün henüz yedek alınmadı.' : 'Henüz yedek alınmamış. BEP dosyalarınız yalnızca bu tarayıcıda tutuluyor.'}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="yedekIndir()" style="background:#38bdf8;color:#0f172a;border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:12.5px;">Yedek Al</button>
      <button onclick="yedekHatirlatErtele()" style="background:transparent;color:#cbd5e1;border:1px solid #475569;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12.5px;">Bugün ertele</button>
    </div>`;
  document.body.appendChild(div);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function ipucu(metin){
  return '<div class="mod-ipucu"><i class="fa-solid fa-lightbulb"></i><div>'+metin+'</div></div>';
}
function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isoTarihYerel(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatTarih(iso){
  const p = String(iso||'').split('-');
  if(p.length < 3) return String(iso||'');
  return p[2] + '.' + p[1] + '.' + p[0];
}

/* ============ ANA RENDER ============ */
let _ilkRender = true;
function render(opts){
  opts = opts || {};
  state.aktifModul = 'bepPlani';
  const oncekiScroll = opts.scrollTop ? 0 : (window.scrollY || window.pageYOffset || 0);
  const el = document.getElementById('icerik-alani');
  try{
    el.innerHTML = modulYaziTipiCubuguHtml() + renderBepPlani();
    modulYaziTipiUygula();
  }catch(hata){
    console.error('Render hatası:', hata);
    el.innerHTML = `
      <div class="evrak-panel p-6" style="border-color:var(--kirmizi); border-width:1.5px;">
        <div class="font-semibold text-[15px]" style="color:var(--metin);">Sayfa yüklenirken bir hata oluştu.</div>
        <div class="text-[12.5px] mt-1 font-mono" style="color:var(--metin-soft); word-break:break-word;">${escapeHtml(hata.message||String(hata))}</div>
        <div class="text-[13px] mt-3" style="color:var(--metin-soft);">Önce «Yedek Al» ile verinizi indirin; sorun sürerse aktif BEP dosyasını kapatabilirsiniz.</div>
        <button class="btn-secondary mt-3" onclick="state.aktifBepId=null;kaydet();render()"><i class="fa-solid fa-rotate-left"></i> Aktif dosyayı kapat</button>
      </div>`;
  }
  try{ yazdirGozleriniBagla(); }catch(_e){}
  if(opts.scrollTop || _ilkRender){ window.scrollTo(0, 0); }
  else { requestAnimationFrame(function(){ window.scrollTo(0, oncekiScroll); }); }
  _ilkRender = false;
}

/* ============ OKUL / ÖĞRETMEN BİLGİLERİ (BEP sayfasında) ============ */
function bepAyarAlan(alan, deger){
  if(!state.ayarlar) state.ayarlar = bosState().ayarlar;
  const eski = state.ayarlar[alan] || '';
  deger = String(deger == null ? '' : deger).trim();
  state.ayarlar[alan] = deger;
  /* Aktif BEP dosyasındaki boş ya da eski değeri taşıyan üye satırlarını güncelle */
  const b = (state.bepDosyalari||[]).find(x => x.id === state.aktifBepId);
  let yenile = false;
  if(b && (alan === 'mudurAdi' || alan === 'ogretmenAdi')){
    const re = alan === 'mudurAdi' ? /müdür/ : /sınıf öğretmeni/;
    (b.uyeler||[]).forEach(function(u){
      if(re.test(String(u.unvan||'').toLocaleLowerCase('tr-TR')) && (!u.adSoyad || u.adSoyad === eski)){ u.adSoyad = deger; yenile = true; }
    });
  }
  kaydet();
  if(alan === 'kademe' || yenile) render();
}

function renderBepOkulBilgileri(){
  const a = state.ayarlar || {};
  const acik = state.okulPanelAcik !== false;
  const ozet = [a.okulAdi, a.ogretmenAdi, a.egitimOgretimYili].filter(Boolean).join(' · ');
  return `
  <div class="evrak-panel p-4 md:p-5 mb-4">
    <button type="button" class="w-full flex items-center justify-between gap-2 text-left" onclick="state.okulPanelAcik=${acik?'false':'true'};kaydet();render()">
      <div class="min-w-0">
        <h2 class="font-display font-semibold text-[15px]"><i class="fa-solid fa-school mr-1.5" style="color:var(--vurgu);"></i>Okul ve Öğretmen Bilgileri</h2>
        ${!acik ? `<div class="text-[12px] mt-0.5 truncate" style="color:var(--metin-soft);">${escapeHtml(ozet || 'Henüz girilmedi — açmak için dokunun')}</div>` : ''}
      </div>
      <i class="fa-solid fa-chevron-${acik?'up':'down'} text-[12px]" style="color:var(--metin-soft);"></i>
    </button>
    ${acik ? `
    <p class="text-[11.5px] mt-2 mb-3" style="color:var(--metin-soft);">Bu bilgiler tüm BEP dosyalarında ortaktır; kapak, üye listesi ve «Uygundur» onayında kullanılır.</p>
    <div class="grid sm:grid-cols-2 gap-3">
      <div><label class="form-label">Okul adı</label><input class="form-input" value="${escapeHtml(a.okulAdi||'')}" placeholder="Örn. Atatürk Ortaokulu" onchange="bepAyarAlan('okulAdi',this.value)"></div>
      <div><label class="form-label">Eğitim-öğretim yılı</label><input class="form-input" value="${escapeHtml(a.egitimOgretimYili||'')}" placeholder="2026-2027" onchange="bepAyarAlan('egitimOgretimYili',this.value)"></div>
      <div>
        <label class="form-label">Eğitim kademesi</label>
        <select class="form-input" onchange="bepAyarAlan('kademe',this.value)">
          ${KADEME_LISTESI.map(k => `<option value="${escapeHtml(k)}" ${a.kademe===k?'selected':''}>${escapeHtml(k)}</option>`).join('')}
        </select>
      </div>
      <div><label class="form-label">Okul müdürü adı soyadı</label><input class="form-input" value="${escapeHtml(a.mudurAdi||'')}" onchange="bepAyarAlan('mudurAdi',this.value)"></div>
      <div><label class="form-label">Öğretmen adı soyadı</label><input class="form-input" value="${escapeHtml(a.ogretmenAdi||'')}" placeholder="BEP'i hazırlayan / sınıf öğretmeni" onchange="bepAyarAlan('ogretmenAdi',this.value)"></div>
      <div><label class="form-label">Branş</label><input class="form-input" value="${escapeHtml(a.brans||'')}" placeholder="Örn. Sınıf Öğretmenliği" onchange="bepAyarAlan('brans',this.value)"></div>
    </div>` : ''}

function bepDosyaTaniNormalize(b){
  if(!b) return;

function bepTaniler(b){
  return [b && b.tani, b && b.tani2].filter(function(t, i, a){ return t && String(t).trim() && a.indexOf(t) === i; });

function bepTaniMetni(b){ return bepTaniler(b).join(' ve '); }

function bepListeBirlestir(metinler){
  const out = [];
  metinler.forEach(function(m){
    String(m||'').split(/\s*,\s*/).forEach(function(x){ x = x.trim(); if(x && out.indexOf(x) < 0) out.push(x); });
  });
  return out.join(', ');
}

  return { yontem: bepListeBirlestir(ler.map(function(x){ return x.yontem; })), materyal: bepListeBirlestir(ler.map(function(x){ return x.materyal; })) };
}

  const out = [];

}

function bepSinifNumarasi(sinifSube){
  const m = String(sinifSube||'').match(/(\d{1,2})/);
  return m ? m[1] : '';
}
/** UDA metninin verilen sınıf numarasına uygun olup olmadığı.
 *  Kod: T.4.1.1 · DKAB.4.2.3 · «4. sınıf» vb. Sınıf ipucu yoksa true. */
function bepUdaSinifaUygunMu(uda, sn){
  if(!sn) return true;
  const s = String(uda || '');
  if(!s) return false;
  const acik = s.match(/(?:^|[^\d])(\d{1,2})\s*\.\s*sınıf/i) || s.match(/sınıf\s*[:=]?\s*(\d{1,2})/i);
  if(acik) return String(acik[1]) === String(sn);
  const kodlar = s.match(/[A-Za-zÇĞİÖŞÜçğıöşü]{1,12}\.(\d{1,2})\./g);
  if(kodlar && kodlar.length){
    return kodlar.some(function(k){
      const m = k.match(/\.(\d{1,2})\./);
      return m && String(m[1]) === String(sn);
    });
  }
  const nokta = s.match(/\.(\d{1,2})\./g);
  if(nokta && nokta.length){
    return nokta.some(function(p){ return p === '.' + sn + '.'; });
  }
  return true;
}
function bepUdaListesiSinifFiltre(udalar, sinifSube){
  const sn = bepSinifNumarasi(sinifSube);
  if(!sn || !udalar || !udalar.length) return udalar || [];
  const uygun = udalar.filter(function(u){ return bepUdaSinifaUygunMu(u, sn); });
  if(uygun.length >= 3) return uygun;
  return udalar.slice();
}

    u.push('Bağımsız araştırma ve proje çalışmaları için süre ve kaynak sağlanır.');
    u.push('Akranlarıyla iş birliği gerektiren grup görevleri planlanır.');
  }
  if(!u.length){
    u.push('Yönergeler açık ve anlaşılır verilir; gerektiğinde tekrar edilir.');
    u.push('Öğrenciye uygun tempo ve destek düzeyi gözetilir.');
  }
  return u;
}

function bepAmacOlustur({ogrenci, beceri, kosul, kriter, sure, destek}){
  const ad = ogrenci || 'Öğrenci';
  return ad + ', ' + (kosul || 'uygun öğretim desteği sunulduğunda') + ' '
    + beceri
    + (destek ? (' ' + destek + ' kullanarak') : '')
    + ', ' + (sure || 'planlanan uygulama süresi sonunda') + ' '
    + (kriter || '%80 doğrulukla') + ' gerçekleştirir.';
}

function bepKdaUret(ad, uda, tani, cinsiyet, perfId){
  const t = (tani||'').toLocaleLowerCase('tr-TR');
  let core = String(uda||'').replace(/^[A-ZÇĞİÖŞÜa-zçğıöşü0-9.\s]+\d+\.\d+\.\d+\.\s*/,'').trim();
  if(core.length > 110) core = core.slice(0, 107) + '…';
  if(!core) core = 'hedeflenen beceriyi';
  const olcutMetin = bepBasariOlcutuUret(perfId);
  if(t.includes('dehb') || t.includes('dikkat')){
    return ad + ', «' + core + '» hedefinde yönergeye uygun dikkatini sürdürerek ' + olcutMetin + ' yanıt verir / tamamlar.';
  }
  if(t.includes('otizm')){
    return ad + ', görsel destek ve model eşliğinde «' + core + '» hedefini ' + olcutMetin + ' sergiler.';
  }
  if(t.includes('zihinsel')){
    return ad + ', «' + core + '» hedefine yönelik basamakları yardım silikleştirilerek ' + olcutMetin + ' tamamlar.';
  }
  if(t.includes('disleksi') || t.includes('öğrenme') || t.includes('disgrafi')){
    return ad + ', «' + core + '» ile ilgili çalışmada ' + olcutMetin + ' doğru performans gösterir.';
  }
  if(t.includes('diskalkuli')){
    return ad + ', somut materyal destekli «' + core + '» çalışmalarında ' + olcutMetin + ' doğru çözer.';
  }
  return ad + ', «' + core + '» hedefine yönelik alt basamakları ' + olcutMetin + ' sergiler.';
}

function bepKatalogUdaSec(ders, sinifSube, adet){
  adet = adet || 8;
  let udalar = [];
  if(typeof BEP_AMAC_KATALOG !== 'undefined' && BEP_AMAC_KATALOG.udaByDers && BEP_AMAC_KATALOG.udaByDers[ders]){
    udalar = BEP_AMAC_KATALOG.udaByDers[ders].slice();
    udalar = bepUdaListesiSinifFiltre(udalar, sinifSube);
  }
  if(!udalar.length) return [];
  const n = Math.min(adet, udalar.length);
  /* Eşit aralıklı seçim: konuları çeşitlendir */
  const sec = [];
  if(n >= udalar.length) return udalar.slice();
  for(let i=0;i<n;i++){
    const idx = Math.round(i * (udalar.length - 1) / Math.max(n - 1, 1));
    const u = udalar[idx];
    if(sec.indexOf(u) < 0) sec.push(u);
  }
  for(let i=0;i<udalar.length && sec.length < n;i++){
    if(sec.indexOf(udalar[i]) < 0) sec.push(udalar[i]);
  }
  return sec;
}

function bepKatalogDerslerAl(b){
  if(!b) return [];
  let arr = [];
  if(Array.isArray(b.katalogDersler) && b.katalogDersler.length){
    arr = b.katalogDersler.filter(function(d){ return !!String(d||'').trim(); });
  } else if(b.katalogDers){
    arr = [b.katalogDers];
  }
  return arr.slice(0, 3);
}
function bepKatalogDerslerYaz(b, dersler){
  if(!b) return;
  const temiz = (Array.isArray(dersler) ? dersler : []).map(function(d){ return String(d||'').trim(); }).filter(Boolean);
  const uniq = [];
  temiz.forEach(function(d){ if(uniq.indexOf(d) < 0) uniq.push(d); });
  b.katalogDersler = uniq.slice(0, 3);
  b.katalogDers = b.katalogDersler[0] || '';
}

function bepKdaListesiUret(ad, uda, tani, cinsiyet, perfId){
  /* Her UDA için 2–3 ölçülebilir KDA (basamaklı) */
  const t = (tani||'').toLocaleLowerCase('tr-TR');
  let core = String(uda||'').replace(/^[A-ZÇĞİÖŞÜa-zçğıöşü0-9.\s]+\d+\.\d+\.\d+\.\s*/,'').trim();
  if(core.length > 100) core = core.slice(0, 97) + '…';
  if(!core) core = 'hedeflenen beceriyi';
  const olcutMetin = bepBasariOlcutuUret(perfId);
  const liste = [];
  const kTani = bepTaniAnahtar(tani);
  if(kTani === 'ustun'){
    liste.push(ad + ', «' + core + '» konusunda sınıf düzeyinin üzerindeki bir problemi farklı çözüm yolları deneyerek çözer.');
    liste.push(ad + ', «' + core + '» ile ilgili bir araştırma sorusu belirler ve en az iki kaynaktan bilgi toplar.');
    liste.push(ad + ', «' + core + '» kapsamında hazırladığı ürünü/sunumu sınıfta paylaşır ve sorulara yanıt verir.');
    return liste;
  }
  if(kTani === 'agirZihinsel'){
    liste.push(ad + ', tam fiziksel yardımla «' + core + '» hedefine yönelik ilk basamağı gerçekleştirir (3/5).');
    liste.push(ad + ', kısmi fiziksel/sözel ipucuyla «' + core + '» hedefinin basamaklarını sırayla tamamlar (3/5).');
    liste.push(ad + ', günlük rutin içinde «' + core + '» ile ilgili beceriyi en az ipucuyla sergiler (3/5).');
    return liste;
  }

  /* 1 — Rehberli / model */
  if(t.includes('otizm')){
    liste.push(ad + ', görsel destek ve model eşliğinde «' + core + '» ile ilgili yönergeyi takip eder; 5 denemenin en az 4\'ünde uygun tepki verir.');
  } else if(t.includes('zihinsel')){
    liste.push(ad + ', fiziksel/sözel yardımla «' + core + '» hedefine yönelik ilk basamakları tamamlar (en az 3/5).');
  } else if(t.includes('dehb') || t.includes('dikkat')){
    liste.push(ad + ', kısa yönerge verildiğinde «' + core + '» görevini başlatır ve en az 3 dakika dikkati sürdürür (4/5 oturum).');
  } else {
    liste.push(ad + ', model olma ve rehberli uygulama ile «' + core + '» hedefine yönelik basamakları sergiler (4/5).');
  }

  /* 2 — Yarı bağımsız / ölçülebilir */
  if(t.includes('disleksi') || t.includes('öğrenme') || t.includes('disgrafi')){
    liste.push(ad + ', «' + core + '» ile ilgili 10 maddelik çalışmada en az 7 maddede bağımsız doğru performans gösterir.');
  } else if(t.includes('diskalkuli')){
    liste.push(ad + ', somut materyal kullanarak «' + core + '» kapsamında 5 sorudan en az 4\'ünü doğru çözer.');
  } else if(t.includes('dil') || t.includes('konuşma')){
    liste.push(ad + ', model sonrası «' + core + '» ile ilgili 5 iletişim fırsatının en az 4\'ünde uygun sözcük/cümle kullanır.');
  } else {
    liste.push(ad + ', «' + core + '» hedefine yönelik alt basamakları ' + olcutMetin + ' sergiler.');
  }

  /* 3 — Bağımsız / genelleme */
  if(t.includes('zihinsel') || t.includes('otizm')){
    liste.push(ad + ', farklı materyal veya ortamda «' + core + '» ile ilgili beceriyi en az 3/5 oranında geneller.');
  } else if(t.includes('dehb') || t.includes('dikkat')){
    liste.push(ad + ', kontrol listesi ile «' + core + '» görevini bağımsız tamamlar (5 oturumun en az 4\'ü).');
  } else {
    liste.push(ad + ', «' + core + '» hedefini bağımsız olarak ' + olcutMetin + ' gerçekleştirir ve benzer örneklerde tekrarlar.');
  }

  return liste;
}

function bepPlanSatirOlustur(opts){
  return {
    uzunDonemli: opts.uzunDonemli || '',
    kisaDonemli: opts.kisaDonemli || '',
    olcut: opts.olcut || '%80 (4/5)',
    yontem: opts.yontem || '',
    materyal: opts.materyal || '',
    uyarlama: opts.uyarlama || '',
    baslangic: opts.baslangic || '',
    bitis: opts.bitis || '',
    degerYontem: opts.degerYontem || 'Ölçüt bağımlı test / gözlem formu',
    degerTarih: opts.degerTarih || '',
    performans: opts.performans || '',
    dersAlan: opts.dersAlan || '',
    durum: opts.durum || 'Planlandı'
  };
}

function bepOrnekPlanOlustur(id, mod){
  /* mod: 'tam' | 'amac' | 'uyarlama' */
  mod = mod || 'tam';
  const b = bepGet(id); if(!b) return;
  if(!(b.ogrenciAdi||'').trim()){
    if(typeof bildirimGoster==='function') bildirimGoster('Önce öğrencinin adını soyadını girin.', true);
    else alert('Önce öğrenci seçin.');
    return;
  }
  if(!(b.tani||'').trim() && mod !== 'amac'){
    if(typeof bildirimGoster==='function') bildirimGoster('Önce eğitsel tanıyı seçin (uyarlama ve yöntemler için).', true);
    else alert('Önce eğitsel tanıyı seçin.');
    return;
  }
  /* Seçili dersler: checkbox listesi veya eski kayıt */
  let dersler = [];
  document.querySelectorAll('.bep-kat-ders-cb:checked').forEach(function(el){ dersler.push(el.value); });
  if(!dersler.length){
    const dersSel = document.getElementById('bep-kat-ders');
    if(dersSel && dersSel.value) dersler = [dersSel.value];
    else dersler = bepKatalogDerslerAl(b);
  }
  dersler = dersler.filter(Boolean).slice(0, 3);
  if(mod !== 'uyarlama' && !dersler.length){
    if(typeof bildirimGoster==='function') bildirimGoster('Önce katalogdan en az bir ders seçin (en fazla 3).', true);
    else alert('Önce ders seçin.');
    return;
  }
  if(dersler.length) bepKatalogDerslerYaz(b, dersler);
  const ders = dersler[0] || '';

  const uyari = 'Örnek plan/öneriler oluşturulacak. Metinler öğrencinin gerçek performansına göre mutlaka gözden geçirilmelidir. Devam edilsin mi?';
  if(!confirm(uyari)) return;

  if((b.planSatirlari||[]).length && (mod==='tam' || mod==='amac')){
    const silinecek = bepOtoSatirSayisi(b);
    const korunan = (b.planSatirlari||[]).length - silinecek;
    if(silinecek > 0){
      if(!confirm('Önceki örnek plan (' + silinecek + ' satır) kaldırılıp ' + (bepTaniler(b).length > 1 ? 'iki tanıya göre ' : '') + 'TEK bir plan yeniden oluşturulacak.' + (korunan > 0 ? ' Elle eklediğiniz ' + korunan + ' satır korunur.' : '') + ' Devam edilsin mi?')) return;
    } else if(!confirm('Örnek amaçlar, elle eklediğiniz ' + korunan + ' satırın altına eklenecek. Devam edilsin mi?')) return;
  }

  const ad = b.ogrenciAdi;
  const bas = b.baslangicTarihi || '';
  const bit = b.bitisTarihi || '';
  const perf = b.performansDuzeyi || 'degerlendirilmedi';
  bepDosyaTaniNormalize(b);
  const ym = bepTaniYontemMateryalCoklu(b);
  const uyarlar = bepTaniUyarlamalariCoklu(b);
  const destekler = bepTaniDestekOnerileriCoklu(b);

  if(mod === 'tam' || mod === 'uyarlama'){
    b.sinifUyarlamalari = uyarlar.join('\n');
    b.destekEgitimOnerileri = destekler.join('\n');
    b.aileSiklik = b.aileSiklik || 'Aylık yüz yüze / telefon ile bilgilendirme yapılacaktır.';
    b.aileYontem = b.aileYontem || 'Yüz yüze görüşme ve yazılı bildirim';
    if(!(b.aileEgitimiYontem||'').trim()) b.aileEgitimiYontem = 'Kısa ev içi pekiştirme önerilerinin aileyle paylaşılması';
    if(!(b.ortamDuzenleme||'').trim()){
      b.ortamDuzenleme = uyarlar.slice(0, 2).join(' ');
    }
    if(!b.destekHizmetler || !b.destekHizmetler.length){
      b.destekHizmetler = [{hizmetTuru:'Destek Eğitim Odası', gelisimAlani: (dersler && dersler.length ? dersler.join(', ') : (ders || '')), haftalikSure:'', sorumlu: (state.ayarlar&&state.ayarlar.ogretmenAdi)||''}];
    }
  }

  if(mod === 'tam' || mod === 'amac'){
    if(!b.planSatirlari) b.planSatirlari = [];
    /* Tek plan: önceki örnek satırları kaldır, elle eklenenleri koru */
    const eskiOtoYok = !b.planSatirlari.some(function(s){ return s.oto; });
    b.planSatirlari = b.planSatirlari.filter(function(s){ return !(s.oto || (eskiOtoYok && b.ornekMi && !b.otoSurum)); });
    b.otoSurum = true;
    /* Çoklu ders: her dersten dengeli UDA (toplam ~8–12) */
    const dersSayisi = Math.max(dersler.length, 1);
    const udaAdetToplam = dersSayisi === 1 ? 8 : (dersSayisi === 2 ? 10 : 12);
    const udaAdetDers = Math.max(3, Math.ceil(udaAdetToplam / dersSayisi));
    let eklenecek = [];
    const olcutSatir = (perf==='fiziksel') ? '%60 (3/5)' : (perf==='yapamiyor' ? '3/5 öğretimle' : '%80 (4/5)');
    const basAy = bas ? bas.slice(0,7) : '';
    const bitAy = bit ? bit.slice(0,7) : '';
    const perfAd = (BEP_PERFORMANS_DUZEY.find(function(x){return x.id===perf;})||{}).ad || '';
    let globalUi = 0;
    let herhangiUda = false;

    dersler.forEach(function(dersAd){
      const udalar = bepKatalogUdaSec(dersAd, b.sinifSube, udaAdetDers);
      if(!udalar.length) return;
      herhangiUda = true;
      udalar.forEach(function(uda){
        const kdaList = bepKdaListesiUret(ad, uda, b.tani, b.cinsiyet, perf);
        const uyarlamaSatir = uyarlar[globalUi % Math.max(uyarlar.length,1)] || uyarlar[0] || '';
        globalUi++;
        kdaList.forEach(function(kda, ki){
          eklenecek.push(bepPlanSatirOlustur({
            uzunDonemli: uda,
            kisaDonemli: kda,
            olcut: olcutSatir,
            yontem: ym.yontem,
            materyal: ym.materyal,
            uyarlama: uyarlamaSatir,
            baslangic: basAy,
            bitis: bitAy,
            degerYontem: ki===0 ? 'Ölçüt bağımlı test / gözlem formu' : (ki===1 ? 'Gözlem / çalışma kâğıdı' : 'Genelleme kontrol listesi'),
            degerTarih: bit || '',
            dersAlan: dersAd,
            performans: perfAd
          }));
        });
      });
    });

    if(herhangiUda){
      /* UDA döngüsü tamam */
    } else {
      const yedek = (typeof bepOrnekAmaclar==='function')
        ? bepOrnekAmaclar(bepTaniMetni(b), ders, ad, b.sinifSube, b.cinsiyet)
        : [];
      yedek.forEach(function(s){
        const kdaList = bepKdaListesiUret(ad, s.uzunDonemli||s.kisaDonemli, b.tani, b.cinsiyet, perf);
        kdaList.forEach(function(kda){
          eklenecek.push(bepPlanSatirOlustur(Object.assign({}, s, {
            kisaDonemli: kda,
            yontem: ym.yontem, materyal: ym.materyal, uyarlama: uyarlar[0]||'',
            baslangic: basAy, bitis: bitAy, degerTarih: bit||'', dersAlan: ders,
            olcut: olcutSatir, performans: perfAd
          })));
        });
      });
    }
    /* Her tanı için tanıya özgü ek UDA + 2–3 KDA */
    bepTaniler(b).forEach(function(tn){
      const ymT = bepTaniYontemMateryal(tn);
      const uyT = bepTaniUyarlamalari(tn);
      bepTaniEkUdalar(ad, tn).forEach(function(ekA){
        const uda = ekA.uda;
        ekA.kdalar.forEach(function(kda){
          eklenecek.push(bepPlanSatirOlustur({
            uzunDonemli: uda,
            kisaDonemli: kda,
            olcut: olcutSatir,
            yontem: ymT.yontem,
            materyal: ymT.materyal,
            uyarlama: uyT[0]||'',
            baslangic: basAy,
            bitis: bitAy,
            degerYontem: 'Gözlem formu / kontrol listesi',
            degerTarih: bit||'',
            dersAlan: ders,
            performans: perfAd
          }));
        });
      });
    });
    /* Aynı amaç iki tanıdan gelirse bir kez yazılır */
    const goruldu = {};
    b.planSatirlari.forEach(function(s){ goruldu[(s.uzunDonemli||'') + '|' + (s.kisaDonemli||'')] = 1; });
    eklenecek.forEach(function(s){
      s.uzunDonemli = bepIsimsizAmac(s.uzunDonemli, ad); s.kisaDonemli = bepIsimsizAmac(s.kisaDonemli, ad);
      const anahtar = s.uzunDonemli + '|' + s.kisaDonemli;
      if(goruldu[anahtar]) return;
      goruldu[anahtar] = 1; s.oto = true; b.planSatirlari.push(s);
    });
    if(!b.performanslar) b.performanslar = [];
    const perfAdP = (BEP_PERFORMANS_DUZEY.find(function(x){return x.id===perf;})||{}).ad || '';
    dersler.forEach(function(dAd){
      if(dAd && !b.performanslar.some(function(p){ return p.alan===dAd; })){
        b.performanslar.push({
          alan: dAd,
          duzey: perfAdP
            ? ('Başlangıç: ' + perfAdP + '. Ayrıntılı ölçüm BEP sürecinde güncellenir.')
            : 'Başlangıç düzeyi ölçülerek BEP\'e işlenecektir.'
        });
      }
    });
    if(!(b.egitselPerformans||'').trim() && !(b.gelisimOykusu||'').trim()){
      /* gelisimOykusu field exists */
    }
    if(false){
      b.gelisimOykusu = ad + ' için «' + (b.tani||'') + '» doğrultusunda ' + (ders||'ilgili alan')
        + ' mevcut performansı gözlem ve ölçüt bağımlı değerlendirme ile ele alınmış; amaçlar bireysel gereksinimlere göre örnek olarak oluşturulmuştur (düzenlenmelidir).';
    }
  }

  if(mod === 'tam' || mod === 'amac'){ try{ bepTarihleriDagit(id, true); }catch(_e){} }
  if(mod === 'tam' || mod === 'amac'){ try{ bepOrnekOykuPerformansDoldur(id, true); }catch(_e){} }
  b.ornekMi = true;
  kaydet();
  render();
  if(typeof bildirimGoster==='function'){
    const msg = mod==='uyarlama'
      ? 'Sınıf uyarlamaları ve destek önerileri eklendi. Gözden geçiriniz.'
      : ('Örnek BEP: ' + (b.planSatirlari||[]).length + ' satır · ' + dersler.length + ' ders · UDA + her UDA için 2–3 KDA · tarihler dengeli. Satırları açıp düzenleyiniz.');
    bildirimGoster(msg);
  }
}

/** Örnek üretimle gelen satır sayısı (eski sürüm örnek planlarında tüm satırlar) */
function bepOtoSatirSayisi(b){
  const satirlar = b.planSatirlari || [];
  const otoVar = satirlar.some(function(s){ return s.oto; });
  if(otoVar) return satirlar.filter(function(s){ return s.oto; }).length;
  return (b.ornekMi && !b.otoSurum) ? satirlar.length : 0;
}
function bepAlanlariniTemizle(id){
  const b = bepGet(id); if(!b) return;
  if(!confirm('Plan satırları, sınıf uyarlamaları ve destek öneri metinleri temizlenecek. Öğrenci kimlik bilgileri kalır. Emin misiniz?')) return;
  b.planSatirlari = [];
  b.sinifUyarlamalari = '';
  b.destekEgitimOnerileri = '';
  b.ornekMi = false;
  kaydet(); render();
  if(typeof bildirimGoster==='function') bildirimGoster('Plan alanları temizlendi.');
}

function bepPlanDogrula(b){
  const hatalar = [];
  const uyarilar = [];
  if(!b) return {hatalar:['Dosya bulunamadı.'], uyarilar:[]};
  if(!(b.ogrenciAdi||'').trim()) hatalar.push('Öğrenci adı ve soyadı girilmelidir.');
  if(!(b.sinifSube||'').trim()) uyarilar.push('Sınıf/şube bilgisi boş.');
  if(!(b.tani||'').trim()) uyarilar.push('Eğitsel tanı seçilmedi.');
  if(b.tani2 && b.tani2 === b.tani) uyarilar.push('1. ve 2. tanı aynı seçilmiş.');
  if(!(b.planSatirlari||[]).length) hatalar.push('En az bir plan satırı (uzun/kısa dönemli amaç) eklenmelidir.');
  (b.planSatirlari||[]).forEach(function(s, i){
    if(!(s.uzunDonemli||'').trim()) hatalar.push((i+1)+'. satır: uzun dönemli amaç boş.');
    if(!(s.kisaDonemli||'').trim()) uyarilar.push((i+1)+'. satır: kısa dönemli amaç boş.');
    if(!(s.olcut||'').trim()) uyarilar.push((i+1)+'. satır: ölçüt boş.');
    [['baslangic','başlangıç'],['bitis','bitiş'],['degerTarih','değerlendirme']].forEach(function(a){
      const v = s[a[0]];
      if(v && /^\d{4}-\d{2}-\d{2}$/.test(v)){
        const g = bepGunDurumu(v);
        if(g.tatil) uyarilar.push((i+1)+'. satır: ' + a[1] + ' tarihi ' + formatTarih(v) + ' tatil (' + g.neden + ').');
      }
    });
    if(/^\d{4}-\d{2}-\d{2}$/.test(s.baslangic||'') && /^\d{4}-\d{2}-\d{2}$/.test(s.bitis||'') && s.baslangic > s.bitis) hatalar.push((i+1)+'. satır: başlangıç tarihi bitişten sonra.');
    if(b.baslangicTarihi && b.bitisTarihi && /^\d{4}-\d{2}-\d{2}$/.test(s.baslangic||'') && (s.baslangic < b.baslangicTarihi || (s.bitis && s.bitis > b.bitisTarihi))) uyarilar.push((i+1)+'. satır: tarihler BEP başlangıç–bitiş aralığının dışında.');
  });
  [['baslangicTarihi','BEP başlangıç'],['bitisTarihi','BEP bitiş'],['sonrakiToplanti','Sonraki toplantı']].forEach(function(a){
    const v = b[a[0]];
    if(v){ const g = bepGunDurumu(v); if(g.tatil) uyarilar.push(a[1] + ' tarihi ' + formatTarih(v) + ' tatil (' + g.neden + ').'); }
  });
  if(b.baslangicTarihi && b.bitisTarihi && b.baslangicTarihi > b.bitisTarihi) hatalar.push('BEP başlangıç tarihi bitiş tarihinden sonra.');
  if(b.baslangicTarihi && !bepMebTakvim(b.baslangicTarihi)) uyarilar.push(bepEgitimYiliTarihten(b.baslangicTarihi) + ' için MEB çalışma takvimi programda tanımlı değil; ara tatil ve dinî bayramları elle kontrol edin.');
  if(b.ornekMi) uyarilar.push('Bu plan «örnek» olarak işaretli; resmî kullanım öncesi gözden geçirin.');
  return {hatalar:hatalar, uyarilar:uyarilar};
}

function bepPlanDogrulaGoster(id){
  const b = bepGet(id); if(!b) return;
  const r = bepPlanDogrula(b);
  let msg = '';
  if(r.hatalar.length) msg += 'Eksikler:\n- ' + r.hatalar.join('\n- ') + '\n\n';
  if(r.uyarilar.length) msg += 'Uyarılar:\n- ' + r.uyarilar.join('\n- ');
  if(!msg) msg = 'Plan temel kontrollerden geçti. Yine de öğrenciye özgü düzenlemeyi unutmayın.';
  alert(msg);
  if(typeof bildirimGoster==='function'){
    if(r.hatalar.length) bildirimGoster('Plan doğrulama: ' + r.hatalar.length + ' eksik, ' + r.uyarilar.length + ' uyarı.', true);
    else bildirimGoster('Plan doğrulama uygun (' + r.uyarilar.length + ' uyarı).');
  }
  return r;
}

function bepDosyaYeni(){
  const d = bepDosyaVarsayilan();
  if(!state.bepDosyalari) state.bepDosyalari = [];
  state.bepDosyalari.unshift(d);
  state.aktifBepId = d.id;
  kaydet(); render();
}
function bepDosyaSec(id){ state.aktifBepId = id; render(); }
function bepDosyaSil(id){
  if(!confirm('Bu BEP dosyası silinsin mi?')) return;
  state.bepDosyalari = (state.bepDosyalari||[]).filter(b=>b.id!==id);
  if(state.aktifBepId===id) state.aktifBepId = state.bepDosyalari[0]?state.bepDosyalari[0].id:null;
  kaydet(); render();
}
function bepGet(id){ return (state.bepDosyalari||[]).find(b=>b.id===id); }
function bepAlan(id, alan, deger){ const b=bepGet(id); if(b){ b[alan]=deger; kaydet(); } }
function bepTaniSec(id, alan, deger){
  const b = bepGet(id); if(!b) return;
  b[alan] = deger || '';
  bepDosyaTaniNormalize(b);
  kaydet(); render();
}
function bepSekmeAdGuncelle(id){
  const b = bepGet(id); const el = document.getElementById('bep-sekme-' + id);
  if(b && el) el.innerHTML = escapeHtml(b.ogrenciAdi||'İsimsiz') + (b.tani ? ' <span class="opacity-70">· ' + escapeHtml((b.tani||'').slice(0,28)) + (b.tani2 ? ' +1' : '') + '</span>' : '');
  const veliUye = (b && b.uyeler||[]).find(u=>(u.unvan||'').toLocaleLowerCase('tr-TR').includes('veli'));
  if(veliUye && !veliUye.adSoyad && b.veliAdi){ veliUye.adSoyad = b.veliAdi; kaydet(); }
}
function bepPerformansEkle(id){ const b=bepGet(id); if(!b)return; if(!b.performanslar)b.performanslar=[]; b.performanslar.push({alan:'',duzey:''}); kaydet(); render(); }
function bepPerformansSil(id,i){ const b=bepGet(id); if(!b)return; b.performanslar.splice(i,1); kaydet(); render(); }
function bepPerfAlan(id,i,alan,deger){ const b=bepGet(id); if(b&&b.performanslar[i]){ if(deger==='__ozel__') return; b.performanslar[i][alan]=deger; kaydet(); if(alan==='alan') render(); } }

const BEP_OLCUT_SEC = ['%100 (5/5)','%80 (4/5)','%60 (3/5)','%50 (2/4)','4/5 denemede doğru','3/4 denemede doğru','2/3 denemede doğru','Bağımsız olarak','İpucu ile','Model ile','Fiziksel yardım ile'];
const BEP_YONTEM_SEC = ['Doğrudan öğretim','Model olma','Rehberli uygulama','Basamaklandırılmış öğretim','Ayrımlı pekiştirme','Şekil verme','Zincirleme','İpucu sunma ve silikleştirme','Gösterip yaptırma','Oyun yoluyla öğretim','Alıştırma','Tekrar','Grup çalışması','Eşli çalışma','İstasyon çalışması','Problem çözme','Soru-cevap','Anlatım','Drama / rol yapma','Gözlem'];
const BEP_MATERYAL_SEC = ['Çalışma kâğıdı','Somut materyal','Etkileşimli tahta','Görsel kartlar','Nesne seti','Pekiştireçler','Zamanlayıcı','Ses kayıt cihazı','Tablet / bilgisayar','Okuma metni','Yazı tahtası','Manipülatifler','Video / animasyon','Kontrol listesi','Öykü kartları','Ölçü araçları'];
const BEP_DEGER_YONTEM_SEC = ['Ölçüt bağımlı test','Gözlem','Kontrol listesi','Anekdot kayıt','Portfolyo','Performans görevi','Öğrenci ürün dosyası','Rubrik','Akran değerlendirme','Öz değerlendirme'];
const BEP_PERFORMANS_SEC = ['Yeterli (+)','Geliştirilmeli (−)','Bağımsız','İpucu ile','Model ile','Gerçekleştirilemedi'];

function bepMsParse(val){
  if(!val) return [];
  return String(val).split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
}
function bepMsToggle(id, i, alan, opt, checked){
  const b = bepGet(id); if(!b || !b.planSatirlari[i]) return;
  let arr = bepMsParse(b.planSatirlari[i][alan]);
  if(checked){ if(!arr.includes(opt)) arr.push(opt); }
  else arr = arr.filter(x => x !== opt);
  b.planSatirlari[i][alan] = arr.join(', ');
  kaydet();
  // update chips without full re-render
  const root = document.querySelector(`.bep-ms[data-id="${id}"][data-i="${i}"][data-alan="${alan}"]`);
  if(root){
    const btn = root.querySelector('.bep-ms-btn');
    if(btn) btn.innerHTML = bepMsChipsHtml(id, i, alan, arr);
  }
}
function bepMsChipsHtml(id, i, alan, arr){
  if(!arr.length) return '<span class="bep-ms-placeholder">Seçiniz…</span>';
  return arr.map(x => `<span class="bep-ms-chip">${escapeHtml(x)}<button type="button" onclick="event.stopPropagation();bepMsToggle('${id}',${i},'${alan}',decodeURIComponent('${encodeURIComponent(x)}'),false)">×</button></span>`).join('');
}

function bepOrnekEkle(id){
  const b=bepGet(id); if(!b)return;
  const dersSel = document.getElementById('bep-kat-ders');
  const ders = (dersSel && dersSel.value) || b.katalogDers || 'Türkçe';
  if(!b.tani){ alert('Önce eğitsel tanıyı seçin; örnek amaçlar tanıya göre üretilir.'); return; }
  const ornekler = bepOrnekAmaclar(bepTaniMetni(b), ders, b.ogrenciAdi, b.sinifSube, b.cinsiyet);
  if(!b.planSatirlari) b.planSatirlari=[];
  const bas = b.baslangicTarihi || '';
  const bit = b.bitisTarihi || '';
  ornekler.forEach(function(o){
    if(!o.baslangic) o.baslangic = bas;
    if(!o.bitis) o.bitis = bit;
    b.planSatirlari.push(o);
  });
  if(!b.performanslar) b.performanslar=[];
  if(!b.performanslar.some(function(p){ return p.alan===ders; })) b.performanslar.push({alan:ders, duzey:''});
  kaydet(); render();
}

function bepKatalogListeHtml(dersler, filtre, sinifSube){
  if(typeof BEP_AMAC_KATALOG === 'undefined') return '<div style="color:#888;">Katalog yüklenemedi.</div>';
  let list = [];
  if(Array.isArray(dersler)) list = dersler.filter(Boolean);
  else if(dersler) list = [dersler];
  if(!list.length) return '<div style="color:#888;">Ders seçince uzun dönemli amaçlar listelenir. Birden fazla ders seçebilirsiniz (en fazla 3).</div>';
  const q = (filtre||'').toLocaleLowerCase('tr-TR').trim();
  const sn = bepSinifNumarasi(sinifSube);
  let html = '';
  let toplamGoster = 0, toplamTum = 0;
  list.forEach(function(ders){
    let tum = (BEP_AMAC_KATALOG.udaByDers && BEP_AMAC_KATALOG.udaByDers[ders]) ? BEP_AMAC_KATALOG.udaByDers[ders].slice() : [];
    const once = tum.length;
    tum = bepUdaListesiSinifFiltre(tum, sinifSube);
    const liste = q ? tum.filter(function(u){ return u.toLocaleLowerCase('tr-TR').includes(q); }) : tum;
    toplamTum += tum.length;
    toplamGoster += liste.length;
    if(list.length > 1){
      html += '<div class="text-[11.5px] font-bold mt-1 mb-1 px-1" style="color:var(--koyu);border-bottom:1px solid var(--cizgi);">' + escapeHtml(ders) + ' <span style="font-weight:500;color:var(--metin-soft);">(' + liste.length + (sn && tum.length !== once ? ' · ' + sn + '. sınıf' : '') + ')</span></div>';
    }
    if(!liste.length){
      html += '<div class="text-[12px] px-1 mb-1" style="color:#888;">Bu derste' + (sn ? (' ' + sn + '. sınıfa uygun') : '') + ' eşleşen amaç yok.</div>';
      return;
    }
    html += liste.map(function(u){
      return '<label class="flex items-start gap-2 py-1 cursor-pointer hover:bg-black/5 rounded px-1">' +
        '<input type="checkbox" class="bep-kat-cb mt-0.5 shrink-0" value="' + escapeHtml(u) + '" data-ders="' + escapeHtml(ders) + '">' +
        '<span>' + escapeHtml(u) + '</span></label>';
    }).join('');
  });
  const sinifNot = sn ? (' · ' + sn + '. sınıf düzeyine göre süzüldü') : '';
  html += '<div class="text-[11px] mt-1" style="color:#888;">' + toplamGoster + ' / ' + toplamTum + ' amaç gösteriliyor' + (list.length > 1 ? (' · ' + list.length + ' ders') : '') + sinifNot + '</div>';
  return html;
}

function bepKatalogDersToggle(id, cb){

  let sec = [];
  document.querySelectorAll('.bep-kat-ders-cb:checked').forEach(function(el){ sec.push(el.value); });
  if(sec.length > 3){
    if(cb) cb.checked = false;
    sec = [];
    document.querySelectorAll('.bep-kat-ders-cb:checked').forEach(function(el){ sec.push(el.value); });
    if(typeof bildirimGoster === 'function') bildirimGoster('En fazla 3 ders seçebilirsiniz.', true);
  }
  bepKatalogDerslerYaz(b, sec);
  kaydet();
  const ozet = document.getElementById('bep-kat-ders-ozet');
  if(ozet){
    ozet.innerHTML = sec.length ? ('Seçili: <b>' + sec.map(escapeHtml).join(' · ') + '</b>') : 'Henüz ders seçilmedi.';
  }
  const kutu = document.getElementById('bep-kat-liste');
  const ara = document.getElementById('bep-kat-ara');
  if(kutu) kutu.innerHTML = bepKatalogListeHtml(sec, ara ? ara.value : '', b.sinifSube);
}

function bepKatalogSecilenleriEkle(id){
  const b = bepGet(id); if(!b) return;
  const kutular = document.querySelectorAll('.bep-kat-cb:checked');
  if(!kutular.length){ bildirimGoster('En az bir uzun dönemli amaç seçin.', true); return; }
  if(!b.planSatirlari) b.planSatirlari = [];
  const varsayilanDers = (bepKatalogDerslerAl(b)[0]) || b.katalogDers || '';
  const eklenenDersler = {};
  kutular.forEach(function(cb){
    const uda = cb.value;
    const ders = cb.getAttribute('data-ders') || varsayilanDers;
    const kisa = '«' + uda + '» hedefine yönelik alt basamakları rehberli ve bağımsız olarak sergiler.';
    b.planSatirlari.push({
      uzunDonemli: uda,
      kisaDonemli: kisa,
      olcut: '%80 (4/5)',
      yontem: 'Doğrudan öğretim, model olma, rehberli uygulama, basamaklandırılmış öğretim',
      materyal: 'Çalışma kâğıdı, somut materyal, etkileşimli tahta',
      baslangic: '', bitis: '',
      degerYontem: 'Ölçüt bağımlı test / gözlem',
      degerTarih: '', performans: '',
      dersAlan: ders
    });
    if(ders) eklenenDersler[ders] = 1;
  });
  if(!b.performanslar) b.performanslar = [];
  Object.keys(eklenenDersler).forEach(function(ders){
    if(!b.performanslar.some(function(p){ return p.alan === ders; })) b.performanslar.push({alan: ders, duzey: ''});
  });
  try{ bepTarihleriDagit(id, true); }catch(_e){}
  kaydet(); render();
  bildirimGoster(kutular.length + ' uzun dönemli amaç plana eklendi. Kısa dönemli amaçları düzenleyebilirsiniz.');
}

function bepTaniAnahtar(tani){
  const t = String(tani || '').toLocaleLowerCase('tr-TR');
  if(/öğrenme|disleksi|diskalkuli|disgrafi/.test(t)) return 'ogrenme';
  if(/dehb|dikkat/.test(t)) return 'dehb';
  if(/dil ve konuşma|konuşma/.test(t)) return 'dil';
  if(/ağır düzeyde zihinsel|çok ağır/.test(t)) return 'agirZihinsel';
  if(/orta düzeyde zihinsel/.test(t)) return 'ortaZihinsel';
  if(/zihinsel/.test(t)) return 'hafifZihinsel';
  if(/otizm/.test(t)) return 'otizm';
  if(/işitme/.test(t)) return 'isitme';
  if(/görme/.test(t)) return 'gorme';
  if(/bedensel|fiziksel|ortopedik/.test(t)) return 'fiziksel';
  if(/süreğen|kronik/.test(t)) return 'sureğen';
  if(/duygusal|davranış/.test(t)) return 'duygusal';
  if(/özel yetenek|üstün/.test(t)) return 'ustun';
  return 'diger';
}
function bepIlkAd(ad){
  const p = String(ad || '').trim().split(/\s+/);

}

  const n = parseInt(bepSinifNumarasi(sinifSube), 10);
  if(!n) return { n:0, seviye:'ortaokul' };
  if(n <= 2) return { n:n, seviye:'erken' };
  if(n <= 4) return { n:n, seviye:'ilkokul' };
  if(n <= 8) return { n:n, seviye:'ortaokul' };
  return { n:n, seviye:'lise' };
}

function bepGelisimOykusuUret(b){
  const k = bepTaniAnahtar(b.tani);
  const ad = bepIlkAd(b.ogrenciAdi) || 'Öğrenci';
  const sinif = String(b.sinifSube || '').trim();
  const p = (BEP_OYKU_SABLON[k] || BEP_OYKU_SABLON.diger).slice();
  let metin = p.join(' ').replace(/\{AD\}/g, ad);
  if(b.tani2 && b.tani2 !== b.tani){
    const k2 = bepTaniAnahtar(b.tani2);
    const p2 = BEP_OYKU_SABLON[k2] || BEP_OYKU_SABLON.diger;
    metin += ' Ayrıca yapılan değerlendirmede «' + b.tani2 + '» tanısı da belirlenmiştir. ' + String(p2[2] || '').replace(/\{AD\}/g, ad);
  }
  const ek = [];
  if(sinif) ek.push('Hâlen ' + sinif + ' sınıfına devam etmektedir.');
  if((b.mevcutDestek || '').trim()) ek.push('Okul dışında ' + String(b.mevcutDestek).trim().replace(/\.$/, '') + ' almaktadır.');
  if(ek.length) metin += ' ' + ek.join(' ');
  return metin + ' (Bilgiler veli görüşmesi, RAM raporu ve öğretmen gözlemlerinden derlenmiştir.)';
}

/* ------------------ Performans düzeyi ------------------ */
function bepAlanKategori(alan){
  const a = String(alan || '').toLocaleLowerCase('tr-TR');
  if(/okuma yazma|ilk okuma/.test(a)) return 'ilkokuma';
  if(/dil gelişim/.test(a)) return 'dilgelisim';
  if(/türkçe|edebiyat|türk dili/.test(a)) return 'turkce';
  if(/matematik/.test(a)) return 'matematik';
  if(/bilişsel/.test(a)) return 'bilissel';
  if(/fen|hayat|fizik|kimya|biyoloji/.test(a)) return 'fen';
  if(/sosyal bilgiler|tarih|coğrafya|felsefe|din/.test(a)) return 'sosyal';
  if(/ingilizce|yabancı/.test(a)) return 'yabanci';
  if(/görsel|müzik|sanat/.test(a)) return 'sanat';
  if(/beden|motor|oyun/.test(a)) return 'motor';
  if(/özbakım|öz bakım|uyumsal/.test(a)) return 'ozbakim';
  if(/sosyal-duygusal|toplumsal|uyum/.test(a)) return 'toplumsal';
  return 'genel';
}
