/** Performans alanları: mevcut girişler + plandaki dersler + tanıya göre ek alan */
function bepOrnekOykuPerformansDoldur(id, sessiz){
  const b = bepGet(id); if(!b) return;
  bepDosyaTaniNormalize(b);
  if(!(b.tani || '').trim()){ if(!sessiz) bildirimGoster('Önce eğitsel tanıyı seçin.', true); return; }
  const dolu = (b.gelisimOykusu || '').trim() || (b.performanslar || []).some(function(p){ return (p.duzey || '').trim() && !/^Başlangıç:/.test(p.duzey); });
  if(!sessiz && dolu && !confirm('Gelişim öyküsü ve performans düzeyi metinleri tanıya göre örnekle yeniden yazılacak. Devam edilsin mi?')) return;
  const otoOyku = function(t){ t = String(t || '').trim(); return !t || t.indexOf('(Bilgiler veli görüşmesi') >= 0 || t.indexOf('örnek olarak oluşturulmuştur') >= 0; };
  const otoPerf = function(t){ t = String(t || '').trim(); return !t || /^Başlangıç:|^Yapabildikleri:/.test(t); };
  if(!sessiz || otoOyku(b.gelisimOykusu)) b.gelisimOykusu = bepGelisimOykusuUret(b);
  const alanlar = [];
  (b.performanslar || []).forEach(function(p){ if(p.alan && alanlar.indexOf(p.alan) < 0) alanlar.push(p.alan); });
  (b.planSatirlari || []).forEach(function(s){ if(s.dersAlan && alanlar.indexOf(s.dersAlan) < 0) alanlar.push(s.dersAlan); });
  if(b.katalogDers && alanlar.indexOf(b.katalogDers) < 0) alanlar.push(b.katalogDers);
  if(!alanlar.length){
    const kademe = state.ayarlar.kademe || 'Ortaokul';
    if(/Öncesi/.test(kademe)) alanlar.push('Bilişsel Gelişim', 'Dil Gelişim (Alıcı/İfade Edici)');
    else if(bepSinifSeviye(b.sinifSube).seviye === 'erken') alanlar.push('İlk Okuma Yazma', 'Matematik');
    else alanlar.push(/Lise/.test(kademe) ? 'Türk Dili ve Edebiyatı' : 'Türkçe', 'Matematik');
  }
  const kler = bepTaniler(b).map(bepTaniAnahtar);
  const varMi = function(liste){ return kler.some(function(x){ return liste.indexOf(x) >= 0; }); };
  if(varMi(['otizm','dehb','duygusal','ortaZihinsel','agirZihinsel']) && !alanlar.some(function(a){ return /toplumsal|sosyal-duygusal/i.test(a); })) alanlar.push('Toplumsal Uyum Becerileri');
  if(varMi(['ortaZihinsel','agirZihinsel']) && !alanlar.some(function(a){ return /özbakım/i.test(a); })) alanlar.push('Özbakım / Uyumsal Beceriler');
  const eski = {};
  (b.performanslar || []).forEach(function(p){ if(p.alan) eski[p.alan] = p.duzey; });
  b.performanslar = alanlar.map(function(a, i){
    if(sessiz && !otoPerf(eski[a])) return { alan: a, duzey: eski[a] };
    let m = bepPerformansMetniUret(a, b);
    if(i > 0) m = m.replace(/(Desteklenmesi gerekenler: [^.]*\.).*$/, '$1');
    return { alan: a, duzey: m };
  });
  if(!(b.davranisProblemi || '').trim() || /^yok$/i.test(String(b.davranisProblemi).trim()) || /gözlenmemektedir|programı hazırlanacaktır|planı uygulanacaktır|geçiş desteği sağlanacaktır/.test(b.davranisProblemi)) b.davranisProblemi = bepDavranisOrnek(b);
  b.ornekMi = true;
  kaydet();
  if(!sessiz){ render(); bildirimGoster('Gelişim öyküsü ve ' + b.performanslar.length + ' alan için performans düzeyi örnek olarak dolduruldu.'); }
}

/* ------------------ Amaç metinlerinden öğrenci adını çıkarma ------------------ */
function bepIsimsizAmac(metin, adSoyad){
  let s = String(metin || '').trim();
  const tam = String(adSoyad || '').trim();
  if(!s || !tam) return s;
  const kac = function(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  const adaylar = [tam, bepIlkAd(tam), tam.split(/\s+/)[0]].filter(function(x, i, a){ return x && a.indexOf(x) === i; });
  for(let i = 0; i < adaylar.length; i++){
    s = s.replace(new RegExp('«\\s*' + kac(adaylar[i]) + "(?:['’][a-zçğıöşü]+)?\\s*[,:]?\\s+", 'gi'), '«');
  }
  for(let i = 0; i < adaylar.length; i++){
    const re = new RegExp('^' + kac(adaylar[i]) + "(?:['’][a-zçğıöşü]+)?\\s*[,:]?\\s+", 'i');
    if(re.test(s)){ s = s.replace(re, ''); break; }
  }
  return s ? s.charAt(0).toLocaleUpperCase('tr-TR') + s.slice(1) : s;
}

/* ------------------ Takvime göre tarih dağıtımı ------------------ */
/* ==========================================================================
   MEB ÇALIŞMA TAKVİMİ MOTORU (v1.7)
   · Tarihler yalnızca ders yılı içindeki İŞ GÜNLERİNE verilir.
   · Hafta sonu, ara tatiller, yarıyıl tatili, yaz tatili, resmî ve dinî
     bayramlar (arifeler dâhil) planlamaya alınmaz.
   · Bir amaç satırı mümkünse bir tatil dönemini kapsamaz; tatil dönemleri
     arasındaki çalışma blokları içinde kalır.
   ========================================================================== */
/** Programda tanımlı MEB takvimleri (eğitim yılı → takvim) */
const MEB_TAKVIMLER = {
  '2026-2027': Object.assign({ yil:'2026-2027', kaynak:'MEB 2026-2027 Eğitim-Öğretim Yılı Çalışma Takvimi' }, MEB_TAKVIM_2026_2027)
};
/* Her yıl aynı tarihe gelen millî/resmî tatiller (takvim tanımlı olmayan yıllar için de geçerli) */
const BEP_SABIT_TATILLER = {
  '01-01':'Yılbaşı', '04-23':'Ulusal Egemenlik ve Çocuk Bayramı', '05-01':'Emek ve Dayanışma Günü',
  '05-19':'Atatürk’ü Anma, Gençlik ve Spor Bayramı', '07-15':'Demokrasi ve Millî Birlik Günü',
  '08-30':'Zafer Bayramı', '10-28':'Cumhuriyet Bayramı Arifesi', '10-29':'Cumhuriyet Bayramı'
};
const BEP_GUN_ADLARI = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

/** Bir tarihin ait olduğu eğitim yılı: 1 Eylül – 31 Ağustos */
function bepEgitimYiliTarihten(iso){
  const y = parseInt(String(iso).slice(0,4), 10), m = parseInt(String(iso).slice(5,7), 10);
  if(!y || !m) return '';
  return m >= 9 ? (y + '-' + (y+1)) : ((y-1) + '-' + y);
}
/** Eğitim yılı (ya da tarih) için MEB takvimi; tanımlı değilse null */
function bepMebTakvim(yilVeyaTarih){
  let k = String(yilVeyaTarih || '').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(k)) k = bepEgitimYiliTarihten(k);
  if(!k && typeof state !== 'undefined' && state.ayarlar) k = String(state.ayarlar.egitimOgretimYili || '').trim();
  return MEB_TAKVIMLER[k] || null;
}
function bepTatilAraliklari(t){
  if(!t) return [];
  return [
    [t.donem1AraTatilBaslangic, t.donem1AraTatilBitis, '1. Dönem Ara Tatili'],
    [t.yariyilTatiliBaslangic, t.yariyilTatiliBitis, 'Yarıyıl Tatili'],
    [t.donem2AraTatilBaslangic, t.donem2AraTatilBitis, '2. Dönem Ara Tatili']
  ].filter(function(a){ return a[0] && a[1]; });
}
/** Günün durumu: { tatil:true/false, neden:'…' } */
function bepGunDurumu(iso){
  iso = String(iso || '');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return { tatil:false, neden:'' };
  const d = new Date(iso + 'T12:00:00');
  const hg = d.getDay();
  if(hg === 0 || hg === 6) return { tatil:true, neden: BEP_GUN_ADLARI[hg] };
  const t = bepMebTakvim(iso);
  if(t){
    const rt = (t.resmiTatiller || []).find(function(r){ return r && r.tarih === iso; });
    if(rt) return { tatil:true, neden: rt.ad };
  }
  const sabit = BEP_SABIT_TATILLER[iso.slice(5)];
  if(sabit) return { tatil:true, neden: sabit };
  if(t){
    const ara = bepTatilAraliklari(t).find(function(a){ return iso >= a[0] && iso <= a[1]; });
    if(ara) return { tatil:true, neden: ara[2] };
    if(iso < t.donem1Baslangic) return { tatil:true, neden:'Ders yılı başlamadan önce (yaz tatili)' };
    if(iso > t.donem2Bitis) return { tatil:true, neden:'Ders yılı sona erdikten sonra (yaz tatili)' };
    if(iso > t.donem1Bitis && iso < t.donem2Baslangic) return { tatil:true, neden:'Yarıyıl Tatili' };
  } else {
    const ay = iso.slice(5,7);
    if(ay === '07' || ay === '08') return { tatil:true, neden:'Yaz tatili' };
  }
  return { tatil:false, neden:'' };
}
function bepTatilMi(iso){ return bepGunDurumu(iso).tatil; }
/** Tarihten itibaren ileri (+1) ya da geri (-1) ilk iş günü */
function bepIsGunuBul(iso, yon){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return iso;
  yon = yon < 0 ? -1 : 1;
  const d = new Date(iso + 'T12:00:00');
  for(let i = 0; i < 400; i++){
    const s = isoTarihYerel(d);
    if(!bepTatilMi(s)) return s;
    d.setDate(d.getDate() + yon);
  }
  return iso;
}

function bepIsGunleri(bas, bit){
  const gunler = [];
  if(!bas || !bit) return gunler;
  const d = new Date(bas + 'T12:00:00'), son = new Date(bit + 'T12:00:00');
  let guv = 0;
  while(d <= son && guv++ < 1200){
    const iso = isoTarihYerel(d);
    if(!bepTatilMi(iso)) gunler.push(iso);
    d.setDate(d.getDate() + 1);
  }
  return gunler;
}

/** BEP'in çalışma sınırları: ders yılı içinde, ilk ve son iş günü */
function bepTakvimSinirlari(b){
  const yil = (b && b.baslangicTarihi) ? bepEgitimYiliTarihten(b.baslangicTarihi) : (state.ayarlar && state.ayarlar.egitimOgretimYili);
  const t = bepMebTakvim(yil) || {};
  let bas = (b && b.baslangicTarihi) || t.donem1Baslangic || isoTarihYerel(new Date());
  let bit = (b && b.bitisTarihi) || t.donem2Bitis || '';
  if(t.donem1Baslangic && bas < t.donem1Baslangic) bas = t.donem1Baslangic;
  if(t.donem2Bitis && bit && bit > t.donem2Bitis) bit = t.donem2Bitis;
  if(!bit){ const d = new Date(bas + 'T12:00:00'); d.setMonth(d.getMonth() + 8); bit = isoTarihYerel(d); }
  return { bas: bepIsGunuBul(bas, 1), bit: bepIsGunuBul(bit, -1) };
}

/** Varsayılan BEP tarihleri — MEB takvimine bağlı */
function bepVarsayilanTarihler(yil){
  yil = String(yil || (state.ayarlar && state.ayarlar.egitimOgretimYili) || '').trim();
  const p = yil.split('-');
  const t = bepMebTakvim(yil);
  if(!p[0] || !p[1]) return { bas:'', bit:'' };
  let bas = p[0] + '-10-01';
  const bugun = isoTarihYerel(new Date());
  const bit = t ? t.donem2Bitis : (p[1] + '-06-15');
  if(bugun > bas && bugun < bit) bas = bugun;
  return { bas: bepIsGunuBul(bas, 1), bit: bepIsGunuBul(bit, -1) };
}

/** İş günlerini tatil aralarına göre bloklara ayırır (aradaki boşluk > 4 gün) */
function bepCalismaBloklari(gunler){
  const bloklar = [];
  let cur = [];
  for(let i = 0; i < gunler.length; i++){
    if(cur.length){
      const onceki = new Date(cur[cur.length-1] + 'T12:00:00'), simdi = new Date(gunler[i] + 'T12:00:00');
      if((simdi - onceki) / 86400000 > 4){ bloklar.push(cur); cur = []; }
    }
    cur.push(gunler[i]);
  }
  if(cur.length) bloklar.push(cur);
  return bloklar;
}
/** n satır için ardışık [başlangıç, bitiş] aralıkları. Satır sayısı yetiyorsa
 *  hiçbir aralık ara tatil / yarıyıl / bayram dönemini kapsamaz. */
function bepAraliklarUret(gunler, n){
  const out = [];
  if(!n || !gunler.length) return out;
  const esitBol = function(liste, k){
    const D = liste.length, r = [];
    for(let j = 0; j < k; j++){
      const a = Math.min(Math.floor(j * D / k), D - 1);
      const z = Math.min(Math.max(a, Math.floor((j + 1) * D / k) - 1), D - 1);
      r.push([liste[a], liste[z]]);
    }
    return r;
  };
  const bloklar = bepCalismaBloklari(gunler).filter(function(bl){ return bl.length >= 3; });
  if(bloklar.length < 2 || n < bloklar.length) return esitBol(gunler, n);
  /* Satırları blok uzunluklarına göre dağıt (en büyük kalan yöntemi), her bloğa ≥1 */
  const D = bloklar.reduce(function(t, bl){ return t + bl.length; }, 0);
  const pay = bloklar.map(function(bl){ return Math.max(1, Math.floor(n * bl.length / D)); });
  let fark = n - pay.reduce(function(t, x){ return t + x; }, 0);
  const kalan = bloklar.map(function(bl, i){ return { i:i, k: n * bl.length / D - Math.floor(n * bl.length / D) }; })
    .sort(function(x, y){ return y.k - x.k; });
  let g = 0;
  while(fark > 0 && g < 1000){ pay[kalan[g % kalan.length].i]++; fark--; g++; }
  g = 0;
  while(fark < 0 && g < 1000){
    const en = pay.indexOf(Math.max.apply(null, pay));
    if(pay[en] > 1){ pay[en]--; fark++; } else break;
    g++;
  }
  bloklar.forEach(function(bl, i){ esitBol(bl, pay[i]).forEach(function(x){ out.push(x); }); });
  return out.slice(0, n);
}

/** Her ders/alan için kısa dönemli amaçları BEP başlangıç–bitiş arasındaki
 *  iş günlerine, tatil dönemlerini atlayarak birbirini izleyen aralıklara dağıtır.
 *  Birden fazla ders seçiliyse her ders aynı dönem boyunca paralel ilerler. */
function bepTarihleriDagit(id, sessiz){
  const b = bepGet(id); if(!b) return;
  const satirlar = b.planSatirlari || [];
  if(!satirlar.length){ if(!sessiz) bildirimGoster('Önce plan satırı ekleyin.', true); return; }
  const sinir = bepTakvimSinirlari(b);
  const gunler = bepIsGunleri(sinir.bas, sinir.bit);
  if(gunler.length < 2){ if(!sessiz) bildirimGoster('BEP başlangıç ve bitiş tarihlerini kontrol edin: aralıkta iş günü yok (hafta sonu ve MEB tatilleri dışlanır).', true); return; }
  const gruplar = {}, sira = [];
  satirlar.forEach(function(s, i){
    const g = s.dersAlan || b.katalogDers || '_';
    if(!gruplar[g]){ gruplar[g] = []; sira.push(g); }
    gruplar[g].push(i);
  });
  sira.forEach(function(g){
    const idx = gruplar[g];
    const ar = bepAraliklarUret(gunler, idx.length);
    idx.forEach(function(si, j){
      const s = satirlar[si], x = ar[j] || ar[ar.length - 1];
      s.baslangic = x[0];
      s.bitis = x[1];
      s.degerTarih = x[1];
    });
  });
  kaydet();
  if(!sessiz){
    render();
    const t = bepMebTakvim(sinir.bas);
    bildirimGoster('Tarihler ' + formatTarih(sinir.bas) + ' – ' + formatTarih(sinir.bit) + ' arasındaki ' + gunler.length + ' iş gününe dağıtıldı' +
      (t ? '; hafta sonları ve MEB tatilleri atlandı.' : '. Bu yıl için MEB takvimi tanımlı değil; yalnızca hafta sonu ve sabit resmî tatiller atlandı.'));
  }
}

/* ---------- Tarih girişleri: tatile denk gelirse iş gününe kaydır ---------- */
function bepTarihUyariHtml(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return '';
  const g = bepGunDurumu(iso);
  return g.tatil ? '<div class="text-[11px] mt-1" style="color:var(--kirmizi);"><i class="fa-solid fa-triangle-exclamation"></i> ' + escapeHtml(formatTarih(iso) + ' · ' + g.neden) + ' — tatil günü</div>' : '';
}
function bepTarihDuzelt(iso, yon, etiket){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
  const g = bepGunDurumu(iso);
  if(!g.tatil) return iso;
  const yeni = bepIsGunuBul(iso, yon);
  bildirimGoster((etiket ? etiket + ': ' : '') + formatTarih(iso) + ' ' + g.neden + ' — ' + (yon < 0 ? 'önceki' : 'sonraki') + ' iş günü ' + formatTarih(yeni) + ' alındı.');
  return yeni;
}
/** BEP dosyası tarih alanı (başlangıç, bitiş, sonraki toplantı) */
function bepTarihAlan(id, alan, deger, el){
  const b = bepGet(id); if(!b) return;
  const yon = alan === 'bitisTarihi' ? -1 : 1;
  const etiket = { baslangicTarihi:'BEP başlangıç', bitisTarihi:'BEP bitiş', sonrakiToplanti:'Sonraki toplantı' }[alan] || '';
  const yeni = bepTarihDuzelt(deger, yon, etiket);
  b[alan] = yeni;
  if(el && el.value !== yeni) el.value = yeni;
  kaydet();
  if(alan === 'baslangicTarihi' || alan === 'bitisTarihi') render();
}
/** BEP tarihlerini MEB takvimine göre ayarlar */
function bepMebTarihleriniAyarla(id){
  const b = bepGet(id); if(!b) return;
  const yil = (b.baslangicTarihi && bepEgitimYiliTarihten(b.baslangicTarihi)) || state.ayarlar.egitimOgretimYili;
  const v = bepVarsayilanTarihler(yil);
  if(!v.bas){ bildirimGoster('Eğitim-öğretim yılını «2026-2027» biçiminde girin.', true); return; }
  b.baslangicTarihi = v.bas;
  b.bitisTarihi = v.bit;
  if((b.planSatirlari || []).length){ bepTarihleriDagit(id, true); }
  kaydet(); render();
  bildirimGoster('BEP ' + formatTarih(v.bas) + ' – ' + formatTarih(v.bit) + ' olarak ayarlandı' + ((b.planSatirlari||[]).length ? '; amaç tarihleri yeniden dağıtıldı.' : '.'));
}
/** Form içinde gösterilen MEB takvimi özeti */
function bepMebTakvimOzetHtml(b){
  const yil = (b && b.baslangicTarihi && bepEgitimYiliTarihten(b.baslangicTarihi)) || (state.ayarlar && state.ayarlar.egitimOgretimYili) || '';
  const t = bepMebTakvim(yil);
  const f = function(a, z){ return formatTarih(a) + ' – ' + formatTarih(z); };
  if(!t) return `<div class="sm:col-span-2 text-[12px] px-3 py-2 rounded" style="background:#FEF3C7;color:#92400E;border:1px solid #F59E0B;">
      <i class="fa-solid fa-calendar-xmark"></i> <b>${escapeHtml(yil || 'Bu')}</b> eğitim yılı için MEB çalışma takvimi programda tanımlı değil. Tarihler dağıtılırken yalnızca hafta sonları, temmuz–ağustos ve sabit resmî tatiller atlanır; ara tatilleri ve dinî bayramları kontrol edin.</div>`;
  const bayram = (t.resmiTatiller || []).filter(function(r){ return /Bayram/.test(r.ad) && !/Arife/.test(r.ad) && r.tarih >= t.donem1Baslangic && r.tarih <= t.donem2Bitis; });
  const bGrup = {};
  bayram.forEach(function(r){ const ad = r.ad.replace(/\s*\d\.\s*Günü.*$/, '').replace(/\s*\(.*$/, ''); (bGrup[ad] = bGrup[ad] || []).push(r.tarih); });
  const bMetin = Object.keys(bGrup).map(function(ad){ const l = bGrup[ad]; return ad + ' ' + (l.length > 1 ? f(l[0], l[l.length-1]) : formatTarih(l[0])); }).join(' · ');
  return `<div class="sm:col-span-2 text-[11.5px] px-3 py-2 rounded" style="background:var(--vurgu-soft);color:var(--metin);border:1px solid var(--cizgi);">
      <div class="flex items-center justify-between gap-2 flex-wrap mb-1">
        <b><i class="fa-solid fa-calendar-check" style="color:var(--vurgu);"></i> MEB ${escapeHtml(t.yil)} çalışma takvimi</b>
        <button type="button" class="btn-secondary text-[11px] px-2 py-1" onclick="bepMebTarihleriniAyarla('${b.id}')"><i class="fa-solid fa-wand-magic-sparkles"></i> BEP tarihlerini takvime göre ayarla</button>
      </div>
      <div>1. dönem: ${f(t.donem1Baslangic, t.donem1Bitis)} · Ara tatil: ${f(t.donem1AraTatilBaslangic, t.donem1AraTatilBitis)}</div>
      <div>Yarıyıl tatili: ${f(t.yariyilTatiliBaslangic, t.yariyilTatiliBitis)}</div>
      <div>2. dönem: ${f(t.donem2Baslangic, t.donem2Bitis)} · Ara tatil: ${f(t.donem2AraTatilBaslangic, t.donem2AraTatilBitis)}</div>
      ${bMetin ? `<div>Resmî/dinî bayramlar: ${escapeHtml(bMetin)}</div>` : ''}
      <div class="mt-1" style="color:var(--metin-soft);">Amaç tarihleri yalnızca bu dönemlerin iş günlerine verilir; hafta sonu, ara tatil, yarıyıl, bayram ve arife günleri planlanmaz.</div>
    </div>`;
}

function bepDersKisaAd(d){
  return String(d || '').replace(/\s*\(.*$/, '').trim() || String(d || '');
}
function bepTarihYaz(v){
  v = String(v || '');
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v.slice(8,10) + '.' + v.slice(5,7) + '.' + v.slice(0,4);
  if(/^\d{4}-\d{2}$/.test(v)) return v.slice(5,7) + '.' + v.slice(0,4);
  return v;
}

function bepUyeSatirlari(b){
  const uy = (b.uyeler || []).filter(function(u){ return (u.unvan || u.adSoyad); });
  const al = function(re){
    const i = uy.findIndex(function(u){ return re.test(String(u.unvan || '').toLocaleLowerCase('tr-TR')); });
    if(i < 0) return null;
    return uy.splice(i, 1)[0];
  };
  const mudur = al(/müdür/);
  const veli = al(/veli|vasi/);
  const sinif = al(/sınıf öğretmeni|okul öncesi öğretmeni/);
  const rehber = al(/rehber|psikolojik/);
  const kurul = al(/değerlendirme kurul/);
  const meslek = [];
  for(let k = 0; k < 3; k++){ const m = al(/meslek/); if(m) meslek.push(m); }
  const alan = [];
  for(let k = 0; k < 3 && uy.length; k++){
    const i = uy.findIndex(function(u){ return /öğretmen/i.test(u.unvan || '') && !/diğer/i.test(u.unvan || ''); });
    if(i < 0) break;
    alan.push(uy.splice(i, 1)[0]);
  }
  return { mudur:mudur, veli:veli, sinif:sinif, rehber:rehber, kurul:kurul, meslek:meslek, alan:alan, diger:uy };
}

function pdfDosyaAdiOner(ek){
  const b = (state.bepDosyalari||[]).find(x => x.id === state.aktifBepId);
  const ad = String((b && b.ogrenciAdi) || 'Ogrenci').replace(/[\\/:*?"<>|]+/g, '').trim().replace(/\s+/g, '_');
  const t = new Date();
  const tarih = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  return 'BEP_' + ad + '_' + tarih + '.pdf';
}
/* ============================================================
   PDF MOTORU (v1.7.0) — tüm "PDF indir" çıktılarının ortak motoru
   İçerik, yazdırmayla AYNI CSS'e sahip, sabit A4 genişliğinde izole
   bir iframe içinde düzenlenir; sayfa kaydırması / telefon ekran
   genişliği yakalamayı etkilemez. Her sayfa ayrı yakalanır; A4'e
   sığmayan içerik satır/paragraf sınırlarından bölünür.
   ============================================================ */
const PDF_PX_MM = 96 / 25.4;

function pdfMotorBekle(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function pdfMotorKare(win){
  return new Promise(function(r){ (win||window).requestAnimationFrame(function(){ (win||window).requestAnimationFrame(r); }); });
}

/** Sayfa birimi için A4 yönü ve kenar boşluğu (mm) */
function pdfMotorBirimAyar(el){
  const cl = el && el.classList;
  if(cl && cl.contains('dk-sayfa')) return { yon:'p', kenar:0 };
  if(cl && cl.contains('pano-sayfa')) return { yon:'p', kenar:8 };
  if(cl && cl.contains('yatay'))    return { yon:'l', kenar:8 };
  return { yon:'p', kenar:10 };
}

/** İzole iframe kur; içerik #pdf-kok içine yerleşir */
async function pdfMotorIframeKur(innerHtml){
  const fr = document.createElement('iframe');
  fr.setAttribute('aria-hidden','true');
  fr.style.cssText = 'position:fixed;left:0;top:0;width:794px;height:1123px;border:0;opacity:0;pointer-events:none;z-index:-9999;';
  document.body.appendChild(fr);
  const doc = fr.contentDocument || fr.contentWindow.document;
  const fontEki = (typeof portalPrintYaziFontEki === 'function') ? portalPrintYaziFontEki() : '';
  const yaziFam = (typeof portalPrintYaziFontAilesi === 'function' ? portalPrintYaziFontAilesi() : '') || "'Noto Sans',Arial,sans-serif";
  doc.open();
  doc.write('<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">' +
    fontEki +
    '<style>' + (typeof PRINT_CSS === 'string' ? PRINT_CSS : '') + '</style>' +
    '<style>html,body{margin:0!important;padding:0!important;background:#fff;overflow:hidden;}' +
    '#pdf-kok{width:100%;margin:0;padding:0;background:#fff;font-family:' + yaziFam + ';}' +
    '#pdf-kok .evrak-sayfa{page-break-after:auto!important;break-after:auto!important;margin:0!important;}' +
    '#pdf-kok img, #pdf-kok svg{max-width:100%;}' +
    '</style></head><body><div id="pdf-kok">' + innerHtml + '</div></body></html>');
  doc.close();
  /* Yazı tipleri ve görseller yüklensin */
  await pdfMotorBekle(60);
  try{ if(doc.fonts && doc.fonts.ready) await Promise.race([doc.fonts.ready, pdfMotorBekle(2500)]); }catch(_e){}
  const imgler = Array.prototype.slice.call(doc.images || []);
  await Promise.all(imgler.map(function(img){
    if(img.complete) return Promise.resolve();
    return new Promise(function(res){ img.onload = res; img.onerror = res; setTimeout(res, 2000); });
  }));
  await pdfMotorKare(fr.contentWindow);
  return { fr: fr, doc: doc, win: fr.contentWindow, kok: doc.getElementById('pdf-kok') };
}

/** İçeriği sayfa birimlerine ayır: en üst düzey .evrak-sayfa/.dk-sayfa/.pdf-sayfa.
 *  Bu birimler içeriğin tamamını kapsamıyorsa (bir kısmı dışarıda kalıyorsa)
 *  hiçbir şey kaybolmasın diye tüm kök tek birim sayılır. */
function pdfMotorBirimler(kok){
  const sec = '.evrak-sayfa, .dk-sayfa, .pdf-sayfa';
  const tum = Array.prototype.slice.call(kok.querySelectorAll(sec));
  const ust = tum.filter(function(el){
    let p = el.parentElement;
    while(p && p !== kok){ if(p.matches && p.matches(sec)) return false; p = p.parentElement; }
    return true;
  });
  if(!ust.length) return [kok];
  const temiz = function(s){ return String(s||'').replace(/\s+/g,''); };
  /* <style>/<script> içeriği görünür metin değildir — hesaba katma */
  const metinUzunluk = function(el){
    let n = temiz(el.textContent).length;
    const gizli = el.querySelectorAll('style, script');
    for(let i=0;i<gizli.length;i++) n -= temiz(gizli[i].textContent).length;
    return Math.max(0, n);
  };
  const toplam = metinUzunluk(kok);
  const kapsanan = ust.reduce(function(a, el){ return a + metinUzunluk(el); }, 0);
  if(toplam > 0 && kapsanan < toplam * 0.98) return [kok];
  return ust;
}

/** Birim içinde güvenli kesme noktaları (px, birimin üstüne göre) + zorunlu sayfa sonları */
function pdfMotorKesmeNoktalari(birim, win, sayfaPx){
  const ust = birim.getBoundingClientRect().top;
  const noktalar = [];
  const zorunlu = [];
  const kacin = []; /* break-inside:avoid ile işaretli, sayfadan kısa bloklar bölünmez */
  const els = birim.querySelectorAll('tr, p, li, h1, h2, h3, h4, h5, table, div, section, br, img, svg, .evrak-imza-alani');
  for(let i=0; i<els.length; i++){
    const r = els[i].getBoundingClientRect();
    if(r.height <= 0 && els[i].tagName !== 'BR') continue;
    noktalar.push(r.bottom - ust);
    noktalar.push(r.top - ust);
    try{
      const cs = win.getComputedStyle(els[i]);
      const once = cs.breakBefore || cs.pageBreakBefore;
      const sonra = cs.breakAfter || cs.pageBreakAfter;
      if(once === 'page' || once === 'always') zorunlu.push(r.top - ust);
      if(sonra === 'page' || sonra === 'always') zorunlu.push(r.bottom - ust);
      const ic = cs.breakInside || cs.pageBreakInside;
      if((ic === 'avoid' || ic === 'avoid-page') && r.height > 4 && (!sayfaPx || r.height < sayfaPx * 0.85)){
        kacin.push([r.top - ust, r.bottom - ust]);
      }
    }catch(_e){}
    if(els[i].classList && (els[i].classList.contains('pdf-page-break') || els[i].classList.contains('html2pdf__page-break'))){
      zorunlu.push(r.top - ust);
    }
  }
  /* Bir elemanın iç sınırı, onu kapsayan tablo satırının ortasına denk gelmesin:
     tr'lerin içine düşen noktaları ele */
  const satirlar = Array.prototype.slice.call(birim.querySelectorAll('tr')).map(function(tr){
    const r = tr.getBoundingClientRect(); return [r.top - ust, r.bottom - ust];
  });
  const guvenli = noktalar.filter(function(y){
    for(let i=0;i<satirlar.length;i++){ if(y > satirlar[i][0] + 0.5 && y < satirlar[i][1] - 0.5) return false; }
    for(let i=0;i<kacin.length;i++){ if(y > kacin[i][0] + 0.5 && y < kacin[i][1] - 0.5) return false; }
    return true;
  });
  const sirala = function(a){ return a.sort(function(x,y){ return x-y; }); };
  return { noktalar: sirala(guvenli), zorunlu: sirala(zorunlu) };
}

/** Tek bir birimi PDF sayfalarına çevirip pdf'e ekler */
async function pdfMotorBirimEkle(ctx, birim){
  const ayar = pdfMotorBirimAyar(birim);
  const sayfaW = ayar.yon === 'l' ? 297 : 210;
  const sayfaH = ayar.yon === 'l' ? 210 : 297;
  let icW = sayfaW - 2*ayar.kenar;
  let icH = sayfaH - 2*ayar.kenar;
  let genislikPx = Math.round(icW * PDF_PX_MM);
  let sayfaPx = icH * PDF_PX_MM;

  /* iframe genişliğini bu birimin içerik genişliğine ayarla ve yeniden düzenlet */
  ctx.fr.style.width = genislikPx + 'px';
  ctx.doc.body.style.width = genislikPx + 'px';
  await pdfMotorKare(ctx.win);

  /* Sayfadan geniş içerik (ör. çok sütunlu tablo) kesilmesin: düzen alanını
     genişlet, çıktıyı A4 genişliğine orantılı küçült */
  let oran = 1;
  let tasan = Math.ceil(birim.scrollWidth || 0);
  /* Tam A4 genişliğinde tasarlanmış sayfa (etiket kağıdı, kapak…): kenar boşluğu
     eklemeden birebir ölçüde bas — küçültme, milimetrik düzen korunur */
  const tamSayfaPx = Math.round(sayfaW * PDF_PX_MM);
  if(ayar.kenar > 0 && tasan > genislikPx + 2 && tasan <= tamSayfaPx + 3){
    ayar.kenar = 0; icW = sayfaW; icH = sayfaH;
    genislikPx = tamSayfaPx; sayfaPx = icH * PDF_PX_MM;
    ctx.fr.style.width = genislikPx + 'px';
    ctx.doc.body.style.width = genislikPx + 'px';
    await pdfMotorKare(ctx.win);
    tasan = Math.ceil(birim.scrollWidth || 0);
  }
  if(tasan > genislikPx + 2){
    oran = genislikPx / tasan;
    genislikPx = tasan;
    sayfaPx = sayfaPx / oran;
    ctx.fr.style.width = genislikPx + 'px';
    ctx.doc.body.style.width = genislikPx + 'px';
    await pdfMotorKare(ctx.win);
  }

  const toplamPx = birim.getBoundingClientRect().height;
  if(toplamPx < 2) return;
  const bosMu = !String(birim.textContent||'').trim() && !birim.querySelector('img, svg, canvas, table');
  if(bosMu) return;

  /* Dilimleri belirle */
  const dilimler = [];
  if(toplamPx <= sayfaPx + 2){
    dilimler.push([0, toplamPx]);
  } else {
    const kn = pdfMotorKesmeNoktalari(birim, ctx.win, sayfaPx);
    let bas = 0;
    let guvenlik = 0;
    while(bas < toplamPx - 1 && guvenlik++ < 400){
      const limit = bas + sayfaPx;
      if(limit >= toplamPx){ dilimler.push([bas, toplamPx]); break; }
      let son = -1;
      /* Önce zorunlu sayfa sonu */
      for(let i=0;i<kn.zorunlu.length;i++){ const z = kn.zorunlu[i]; if(z > bas + 20 && z <= limit){ son = z; break; } }
      if(son < 0){
        /* Sayfanın en az %40'ı dolu olacak şekilde en alttaki güvenli nokta */
        for(let i=kn.noktalar.length-1;i>=0;i--){ const y = kn.noktalar[i]; if(y <= limit && y > bas + sayfaPx*0.4){ son = y; break; } }
      }
      if(son < 0) son = limit; /* güvenli nokta yok (ör. dev tek satır) — sert kes */
      dilimler.push([bas, son]);
      bas = son;
    }
  }

  /* Dilimleri yakala: birimi overflow:hidden bir kutuya al, üst ofsetle kaydır */
  const anaYer = birim.parentNode, sonraki = birim.nextSibling;
  const kutu = ctx.doc.createElement('div');
  kutu.style.cssText = 'position:relative;overflow:hidden;background:#fff;width:' + genislikPx + 'px;';
  const ic = ctx.doc.createElement('div');
  ic.style.cssText = 'position:absolute;left:0;top:0;width:' + genislikPx + 'px;';
  kutu.appendChild(ic);
  ctx.doc.body.insertBefore(kutu, ctx.doc.body.firstChild);
  ic.appendChild(birim);

  try{
    for(let d=0; d<dilimler.length; d++){
      const y0 = dilimler[d][0], y1 = dilimler[d][1];
      const h = Math.max(1, Math.ceil(y1 - y0));
      kutu.style.height = h + 'px';
      ic.style.top = (-y0) + 'px';
      ctx.fr.style.height = Math.max(h, 50) + 'px';
      await pdfMotorKare(ctx.win);
      if(typeof ctx.ilerleme === 'function') ctx.ilerleme();
      const canvas = await ctx.h2c(kutu, {
        scale: ctx.scale, useCORS: true, logging: false, backgroundColor: '#ffffff',
        scrollX: 0, scrollY: 0, x: 0, y: 0,
        width: genislikPx, height: h,
        windowWidth: genislikPx, windowHeight: Math.max(h, 50)
      });
      const hMm = Math.min(icH, (h / PDF_PX_MM) * oran);
      if(!ctx.pdf){
        ctx.pdf = new ctx.JsPdf({ unit:'mm', format:'a4', orientation: ayar.yon === 'l' ? 'landscape' : 'portrait', compress:true });
      } else {
        ctx.pdf.addPage('a4', ayar.yon === 'l' ? 'landscape' : 'portrait');
      }
      ctx.pdf.addImage(canvas.toDataURL('image/jpeg', 0.93), 'JPEG', ayar.kenar, ayar.kenar, icW, hMm);
      ctx.sayfaSayisi++;
    }
  } finally {
    /* Birimi yerine koy, kutuyu kaldır */
    if(anaYer){ if(sonraki && sonraki.parentNode === anaYer) anaYer.insertBefore(birim, sonraki); else anaYer.appendChild(birim); }
    if(kutu.parentNode) kutu.parentNode.removeChild(kutu);
  }
}

/** jsPDF / html2canvas globalde yoksa CDN'den yükle (html2pdf paketi bunları dışa açmıyor) */
function pdfMotorScriptYukle(src){
  return new Promise(function(res){
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = res;
    document.head.appendChild(s);
    setTimeout(res, 8000);
  });
}
async function pdfMotorKutuphaneYukle(){
  if(typeof window.html2canvas !== 'function') await pdfMotorScriptYukle('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!((window.jspdf && window.jspdf.jsPDF) || window.jsPDF)) await pdfMotorScriptYukle('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}

/** ANA GİRİŞ: HTML → jsPDF nesnesi */
async function pdfMotorUret(innerHtml, ilerlemeCb){
  await pdfMotorKutuphaneYukle();
  const JsPdf = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  const h2c = window.html2canvas;
  if(!JsPdf || typeof h2c !== 'function') throw new Error('PDF kütüphanesi yok');
  const ortam = await pdfMotorIframeKur(innerHtml);
  const ctx = { fr: ortam.fr, doc: ortam.doc, win: ortam.win, JsPdf: JsPdf, h2c: h2c, pdf: null, sayfaSayisi: 0, scale: 2, ilerleme: null };
  try{
    const birimler = pdfMotorBirimler(ortam.kok);
    if(birimler.length > 25) ctx.scale = 1.5; else if(birimler.length > 10) ctx.scale = 1.75;
    let sayac = 0;
    ctx.ilerleme = function(){ sayac++; if(typeof ilerlemeCb === 'function') ilerlemeCb(sayac); };
    for(let i=0; i<birimler.length; i++){
      await pdfMotorBirimEkle(ctx, birimler[i]);
    }
    if(!ctx.pdf) throw new Error('PDF içeriği boş');
    return ctx.pdf;
  } finally {
    if(ortam.fr.parentNode) ortam.fr.parentNode.removeChild(ortam.fr);
  }
}

function portalPdfKutuphaneVarMi(){
  const JsPdf = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  return !!(JsPdf && typeof window.html2canvas === 'function');
}

let _portalPdfMesgul = false;
async function portalPdf(innerHtml, dosyaAdi){
  if(!innerHtml || !String(innerHtml).trim()){ alert('PDF için içerik bulunamadı.'); return; }
  if(_portalPdfMesgul){ if(typeof bildirimGoster === 'function') bildirimGoster('PDF zaten hazırlanıyor, lütfen bekleyin…'); return; }
  window.__sonYazdirHtml = innerHtml;
  const ad = dosyaAdi || pdfDosyaAdiOner('evrak');
  await pdfMotorKutuphaneYukle();
  if(!portalPdfKutuphaneVarMi()){
    alert('PDF kütüphanesi yüklenemedi (internet gerekli). Yazdır → «PDF olarak kaydet» kullanabilirsiniz.');
    portalPrint(innerHtml);
    return;
  }
  _portalPdfMesgul = true;
  try{
    if(typeof bildirimGoster === 'function') bildirimGoster('PDF hazırlanıyor…');
    const pdf = await pdfMotorUret(innerHtml);
    pdf.save(ad);
    if(typeof bildirimGoster === 'function') bildirimGoster('PDF indirildi: ' + ad);
  }catch(hata){
    console.error('portalPdf hatası:', hata);
    alert('PDF oluşturulamadı. Yazdır menüsünden «PDF olarak kaydet» deneyin.');
  }finally{
    _portalPdfMesgul = false;
  }
}

function dosyaIndirBlob(blob, dosyaAdi){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = dosyaAdi || 'dosya.bin';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 2500);
}

    .slice(0, 120) || 'dosya';
}


function yazdirGozleriniBagla(){
  const adaylar = document.querySelectorAll('button');
  adaylar.forEach(btn => {
    if(btn.dataset.eyeDone === '1') return;
    if(btn.classList.contains('print-eye-btn') || btn.classList.contains('print-pdf-btn')) return;
    const onclick = btn.getAttribute('onclick') || '';
    const txt = btn.textContent || '';
    const inner = btn.innerHTML || '';
    const yazdirMi =
      /Yazdır|Yazdir|yazdır|yazdir/i.test(txt) ||
      /fa-print/.test(inner) ||
      /Yazdir|Yazdır|portalPrint\s*\(/.test(onclick);
    if(!yazdirMi) return;
    if(/önizle|onizle|Önizle|fa-eye|print-eye|PDF|pdf|fa-file-pdf/i.test(txt+inner+onclick)) return;
    btn.dataset.eyeDone = '1';
    if(!btn.classList.contains('btn-yazdir')) btn.classList.add('btn-yazdir');

    /* PDF indir */
    const pdfBtn = document.createElement('button');
    pdfBtn.type = 'button';
    pdfBtn.className = 'print-pdf-btn icon-only';
    pdfBtn.title = 'PDF indir';
    pdfBtn.setAttribute('aria-label', 'PDF indir');
    pdfBtn.innerHTML = '<i class="fa-solid fa-file-pdf"></i>';
    pdfBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      const onceki = portalPrint;
      let yakalandi = null;
      portalPrint = function(html, opts){
        if(opts && opts.onizleme){ onceki(html, opts); return; }
        yakalandi = html;
      };
      try{ btn.click(); } catch(err){ console.warn(err); }
      portalPrint = onceki;
      const icerik = yakalandi || window.__sonYazdirHtml;
      if(!icerik){ alert('PDF içeriği alınamadı. Önce yazdırmayı deneyin.'); return; }
      const modul = (typeof state !== 'undefined' && state.aktifModul) ? state.aktifModul : 'evrak';
      portalPdf(icerik, pdfDosyaAdiOner(modul));
    });

    /* Ekranda düzenle (kalem) — evrakı yazdırmadan önce metin üzerinde değiştir */
    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'print-edit-btn icon-only';
    editBtn.title = 'Ekranda düzenle';
    editBtn.setAttribute('aria-label', 'Ekranda düzenle');
    editBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i>';
    editBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      const onceki = portalPrint;
      let yakalandi = null;
      portalPrint = function(html, opts){
        if(opts && opts.onizleme){ onceki(html, opts); return; }
        yakalandi = html;
      };
      try{ btn.click(); } catch(err){ console.warn(err); }
      portalPrint = onceki;
      const icerik = yakalandi || window.__sonYazdirHtml;
      if(!icerik){ alert('Düzenlenecek içerik alınamadı. Önce evrakın alanlarını doldurun.'); return; }
      const modulAdi = (typeof MODUL_ADLARI !== 'undefined' && state && MODUL_ADLARI[state.aktifModul]) ? MODUL_ADLARI[state.aktifModul] : 'Evrak';
      evrakDuzenleOnizlemeAc(icerik, modulAdi + ' — Ekranda Düzenle');
    });

    /* Önizleme göz */
    const eye = document.createElement('button');
    eye.type = 'button';
    eye.className = 'print-eye-btn';
    eye.title = 'Yazdırma önizlemesi — basılı tutun';
    eye.setAttribute('aria-label', 'Yazdırma önizlemesi');
    eye.innerHTML = '<i class="fa-solid fa-eye"></i>';
    let basili = false;
    eye.addEventListener('pointerdown', function(e){
      e.preventDefault();
      e.stopPropagation();
      basili = true;
      try{ eye.setPointerCapture(e.pointerId); }catch(_e){}
      const onceki = portalPrint;
      portalPrint = function(html){ onceki(html, {onizleme:true}); };
      try{ btn.click(); } catch(err){ console.warn(err); }
      portalPrint = onceki;
    });
    const bitir = function(e){
      if(!basili) return;
      basili = false;
      if(e){ try{ e.preventDefault(); e.stopPropagation(); }catch(_e){} }
      printOnizlemeKapat();
    };
    eye.addEventListener('pointerup', bitir);
    eye.addEventListener('pointercancel', bitir);
    eye.addEventListener('lostpointercapture', bitir);
    eye.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); });

    if(btn.parentNode){
      const ref = btn.nextSibling;
      if(ref){
        btn.parentNode.insertBefore(pdfBtn, ref);
        btn.parentNode.insertBefore(editBtn, pdfBtn.nextSibling);
        btn.parentNode.insertBefore(eye, editBtn.nextSibling);
      } else {
        btn.parentNode.appendChild(pdfBtn);
        btn.parentNode.appendChild(editBtn);
        btn.parentNode.appendChild(eye);
      }
    }
  });
}

function portalPrint(innerHtml, opts){
  opts = opts || {};
  if(!innerHtml || !String(innerHtml).trim()){
    console.warn('portalPrint: boş içerik');
    if(!opts.onizleme) alert('Yazdırılacak içerik bulunamadı.');
    return;
  }
  window.__sonYazdirHtml = innerHtml;
  if(opts.onizleme){
    printOnizlemeAc(innerHtml);
    return;
  }

  /* Önizleme bayrağı asla yazdırmayı engellemesin */
  let iframe = document.getElementById('print-iframe');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.id = 'print-iframe';
    iframe.setAttribute('aria-hidden', 'true');
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(iframe);
  }

  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(
    '<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>Yazdır</title>' +
    (typeof portalPrintYaziFontEki === 'function' ? portalPrintYaziFontEki() : '') +
    '<style>' + PRINT_CSS + '</style>' +
    '</head><body>' + innerHtml + '</body></html>'
  );
  doc.close();

  const win = iframe.contentWindow;
  const tetikle = function(){
    try{
      win.focus();
      win.print();
    }catch(e){
      console.error('iframe print hatası', e);
      try{
        const w = window.open('', '_blank', 'noopener,noreferrer,width=900,height=700');
        if(w){
          w.document.write(
            '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Yazdır</title>' +
            '<style>' + PRINT_CSS + '</style></head><body>' + innerHtml + '</body></html>'
          );
          w.document.close();
          w.focus();
          setTimeout(function(){ try{ w.print(); }catch(_e){} }, 300);
        }else{
          alert('Yazdırma penceresi açılamadı. Tarayıcı pop-up engelini kontrol et.');
        }
      }catch(e2){
        alert('Yazdırma başlatılamadı.');
      }
    }
  };
  let basildi = false;
  const birKez = function(){
    if(basildi) return;
    basildi = true;
    tetikle();
  };
  iframe.onload = function(){
    try{
      const d = iframe.contentDocument;
      if(d && d.fonts && d.fonts.ready){
        d.fonts.ready.then(function(){ setTimeout(birKez, 50); }).catch(function(){ birKez(); });
        setTimeout(birKez, 800);
        return;
      }
    }catch(_e){}
    birKez();
  };
  setTimeout(birKez, (typeof portalPrintYaziFontAilesi === 'function' && portalPrintYaziFontAilesi()) ? 700 : 280);
}

/* ============ KÜÇÜK BİLDİRİM ============ */
function bildirimGoster(mesaj, hata){
  const eski = document.getElementById('mini-bildirim');
  if(eski) eski.remove();
  const div = document.createElement('div');
  div.id = 'mini-bildirim';
  div.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 rounded-lg text-[13px] font-medium shadow-lg';
  div.style.background = hata ? 'var(--kirmizi)' : 'var(--koyu)';
  div.style.color = '#fff';
  div.textContent = mesaj;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2200);
}


/* ============ BUTON İPUCU (hover; mobilde kapalı) ============ */
function btnIpucuEl(){
  let el = document.getElementById('btn-ipucu');
  if(!el){
    el = document.createElement('div');
    el.id = 'btn-ipucu';
    el.setAttribute('role', 'tooltip');
    document.body.appendChild(el);
  }
  return el;
}
function btnIpucuHoverDestekliMi(){
  try{
    return window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  }catch(e){ return false; }
}
function btnIpucuGoster(hedef){
  if(!btnIpucuHoverDestekliMi()) return;
  const metin = hedef && hedef.getAttribute('data-ipucu');
  if(!metin) return;
  const baslik = hedef.getAttribute('data-ipucu-baslik') || '';
  const el = btnIpucuEl();
  el.innerHTML = (baslik ? '<div class="bi-baslik">' + baslik + '</div>' : '') + '<div>' + metin + '</div>';
  el.classList.add('acik');
  const r = hedef.getBoundingClientRect();
  const pad = 8;
  let sol = r.left + r.width / 2 - 140;
  sol = Math.max(pad, Math.min(sol, window.innerWidth - 300 - pad));
  let ust = r.bottom + 8;
  el.style.left = sol + 'px';
  el.style.top = ust + 'px';
  /* Alta sığmazsa yukarı aç */
  requestAnimationFrame(function(){
    const h = el.offsetHeight || 80;
    if(ust + h > window.innerHeight - pad){
      el.style.top = Math.max(pad, r.top - h - 8) + 'px';
    }
  });
}
function btnIpucuGizle(){
  const el = document.getElementById('btn-ipucu');
  if(el) el.classList.remove('acik');
}
(function btnIpucuBagla(){
  if(window.__btnIpucuBagli) return;
  window.__btnIpucuBagli = true;
  document.addEventListener('mouseover', function(e){
    if(!btnIpucuHoverDestekliMi()) return;
    const t = e.target && e.target.closest ? e.target.closest('[data-ipucu]') : null;
    if(t) btnIpucuGoster(t);
  });
  document.addEventListener('mouseout', function(e){
    const t = e.target && e.target.closest ? e.target.closest('[data-ipucu]') : null;
    if(!t) return;
    const to = e.relatedTarget;
    if(to && t.contains(to)) return;
    btnIpucuGizle();
  });
  document.addEventListener('scroll', btnIpucuGizle, true);
  document.addEventListener('click', btnIpucuGizle, true);
})();
